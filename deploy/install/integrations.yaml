  - CRATE_WORKER_SQLALCHEMY_MAX_OVERFLOW
  - CRATE_WORKER_SQLALCHEMY_POOL_SIZE
  - FAST_WORKER_PROCESSES
  - MAINTENANCE_LEGACY_POOL_MAXCONN
  - MAINTENANCE_SQLALCHEMY_MAX_OVERFLOW
  - MAINTENANCE_SQLALCHEMY_POOL_SIZE
  - MAINTENANCE_WORKER_PROCESSES
  - PLAYBACK_LEGACY_POOL_MAXCONN
  - PLAYBACK_SQLALCHEMY_MAX_OVERFLOW
  - PLAYBACK_SQLALCHEMY_POOL_SIZE
  - PLAYBACK_WORKER_PROCESSES
  - PROJECTOR_LEGACY_POOL_MAXCONN
  - PROJECTOR_SQLALCHEMY_MAX_OVERFLOW
  - PROJECTOR_SQLALCHEMY_POOL_SIZE
