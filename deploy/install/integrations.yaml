integrations:
  - id: lastfm
    group: enrichment
    title: Last.fm
    tagline: biographies, tags and similar artists
    summary: Artist biographies, tags, similar artists and listening data.
    recommended: true
    env:
      - name: LASTFM_APIKEY
        label: API key
        secret: true
      - name: LASTFM_API_SECRET
        label: Shared secret
        secret: true
    get_key:
      url: https://www.last.fm/api/account/create
      steps:
        - Sign in to Last.fm and open the API account page.
        - Name the application after your Crate instance; the callback URL can stay empty.
        - Copy the API key and the shared secret.
    validate: lastfm

  - id: fanart
    group: enrichment
    title: Fanart.tv
    tagline: artist photos and logos
    summary: Artist photos, logos and backgrounds.
    recommended: true
    env:
      - name: FANART_API_KEY
        label: Personal API key
        secret: true
    get_key:
      url: https://fanart.tv/get-an-api-key/
      steps:
        - Create a free fanart.tv account.
        - Open your profile and copy the personal API key.
    validate: fanart

  - id: spotify
    group: enrichment
    title: Spotify
    tagline: popularity and artwork
    summary: Popularity signals and artwork for your artists.
    env:
      - name: SPOTIFY_ID
        label: Client ID
      - name: SPOTIFY_SECRET
        label: Client secret
        secret: true
    get_key:
      url: https://developer.spotify.com/dashboard
      steps:
        - Create an app in the Spotify developer dashboard.
        - Any redirect URI works; Crate only uses client credentials.
        - Copy the client ID and the client secret.
    validate: spotify

  - id: discogs
    group: enrichment
    title: Discogs
    tagline: credits, labels and editions
    summary: Credits, labels and release editions.
    env:
      - name: DISCOGS_CONSUMER_KEY
        label: Consumer key
      - name: DISCOGS_CONSUMER_SECRET
        label: Consumer secret
        secret: true
    get_key:
      url: https://www.discogs.com/settings/developers
      steps:
        - Register a new application in your Discogs developer settings.
        - Copy the consumer key and the consumer secret.
    validate: discogs

  - id: setlistfm
    group: shows
    title: Setlist.fm
    tagline: probable setlists
    summary: Probable setlists for your artists' upcoming shows.
    env:
      - name: SETLISTFM_API_KEY
        label: API key
        secret: true
    get_key:
      url: https://www.setlist.fm/settings/api
      steps:
        - Sign in to setlist.fm and apply for an API key for non-commercial use.
        - The key arrives on the same page once approved.
    validate: setlistfm

  - id: ticketmaster
    group: shows
    title: Ticketmaster
    tagline: upcoming concerts
    summary: Upcoming concerts for the artists in your library.
    env:
      - name: TICKETMASTER_API_KEY
        label: Consumer key
        secret: true
    get_key:
      url: https://developer.ticketmaster.com/user/me/apps
      steps:
        - Create a Ticketmaster developer account.
        - Open My Apps and copy the consumer key of the default app.
    validate: ticketmaster

  - id: soulseek
    group: acquisition
    title: Soulseek
    tagline: downloads through slskd
    summary: Search and download from the Soulseek network through slskd.
    env:
      - name: SLSKD_URL
        label: slskd URL
        placeholder: http://192.168.1.20:5030
      - name: SLSKD_API_KEY
        label: slskd API key
        secret: true
      - name: SLSKD_SLSK_USERNAME
        label: Soulseek username
      - name: SLSKD_SLSK_PASSWORD
        label: Soulseek password
        secret: true
      - name: SLSKD_LISTEN_PORT
        label: Soulseek listening port
        default: "50300"
    get_key:
      url: https://github.com/slskd/slskd
      steps:
        - Crate can run slskd for you, or use an slskd server you already have.
        - With Crate's slskd, pick a Soulseek username and password; the network creates the account the first time it signs in.
        - Forward the listening port on your router so other users can reach you; searches work without it, downloads get faster with it.
    validate: slskd

  - id: telegram
    group: notifications
    title: Telegram
    tagline: alerts on your phone
    summary: Alerts about imports, failures and new releases, and quick actions from your phone.
    env:
      - name: TELEGRAM_BOT_TOKEN
        label: Bot token
        secret: true
      - name: TELEGRAM_CHAT_ID
        label: Chat ID
    get_key:
      url: https://t.me/BotFather
      steps:
        - Open @BotFather in Telegram and send /newbot.
        - Pick a name and a username ending in bot; BotFather replies with the token.
        - Crate finds your chat ID when you send your new bot a message.
    validate: telegram

  - id: tidal
    group: acquisition
    title: Tidal
    tagline: lossless downloads
    summary: Download lossless albums with your Tidal subscription.
    env: []
    get_key:
      url: https://tidal.com/activate
      steps:
        - Tidal uses a device code instead of an API key.
        - After Crate starts, open Admin > Settings > Downloads and connect Tidal.
    validate: tidal

  - id: ai
    group: ai
    title: AI models
    tagline: Gemini, OpenAI, Anthropic or Ollama
    summary: Biographies, playlist ideas and agents through Gemini, OpenAI, Anthropic or a local Ollama.
    env:
      - name: LLM_PROVIDER
        label: Default model
      - name: GEMINI_API_KEY
        label: Gemini API key
        secret: true
      - name: OPENAI_API_KEY
        label: OpenAI API key
        secret: true
      - name: ANTHROPIC_API_KEY
        label: Anthropic API key
        secret: true
      - name: OLLAMA_URL
        label: Ollama URL
      - name: AUDIOMUSE_GEMINI_API_KEY
        label: Gemini API key for AudioMuse
        secret: true
    get_key:
      url: https://aistudio.google.com/app/apikey
      steps:
        - Gemini keys come from Google AI Studio; it has a free tier.
        - OpenAI keys come from https://platform.openai.com/api-keys
        - Anthropic keys come from https://console.anthropic.com/settings/keys
        - Ollama runs locally and needs no key; point Crate at its URL.
    validate: ai

  - id: mcp
    group: ai
    title: Agents (MCP)
    tagline: Claude, Codex and other agents
    summary: Let Claude, Codex and other agents read and operate Crate.
    env:
      - name: CRATE_MCP_ENABLED
        label: Enable the MCP endpoint
      - name: CRATE_MCP_ACTIONS_ENABLED
        label: Allow agents to change things
      - name: CRATE_MCP_OAUTH_ENABLED
        label: OAuth for agents
      - name: CRATE_MCP_OAUTH_ISSUER
        label: OAuth issuer URL
      - name: CRATE_MCP_OAUTH_ALLOW_LOCALHOST
        label: Allow localhost OAuth clients
      - name: CRATE_MCP_ALLOWED_ORIGINS
        label: Allowed origins
      - name: CRATE_MCP_ALLOWED_HOSTS
        label: Allowed hosts
      - name: CRATE_MCP_ADMIN_ORIGINS
        label: Admin origins
    get_key:
      url: https://cratemusic.app/docs
      steps:
        - Agents connect with tokens you create in Admin > Agents.

  - id: google-login
    group: accounts
    title: Sign in with Google
    tagline: listeners sign in with Google
    summary: Let listeners sign in with their Google account.
    env:
      - name: GOOGLE_CLIENT_ID
        label: OAuth client ID
      - name: GOOGLE_CLIENT_SECRET
        label: OAuth client secret
        secret: true
    get_key:
      url: https://console.cloud.google.com/apis/credentials
      steps:
        - Create an OAuth client ID of type Web application.
        - Add https://api.<your domain>/api/auth/oauth/google/callback as a redirect URI.

  - id: apple-login
    group: accounts
    title: Sign in with Apple
    tagline: listeners sign in with Apple
    summary: Let listeners sign in with their Apple ID.
    env:
      - name: APPLE_CLIENT_ID
        label: Services ID
      - name: APPLE_TEAM_ID
        label: Team ID
      - name: APPLE_KEY_ID
        label: Key ID
      - name: APPLE_PRIVATE_KEY
        label: Private key
        secret: true
    get_key:
      url: https://developer.apple.com/account/resources/identifiers/list/serviceId
      steps:
        - Requires a paid Apple Developer account.
        - Create a Services ID and a Sign in with Apple key, then copy the IDs and the key.
