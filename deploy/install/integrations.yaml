  - CRATE_CREDENTIAL_PREVIOUS_KEYS
  - CRATE_FEDERATION_IMPORT_FREE_HEADROOM_BYTES
  - CRATE_FEDERATION_IMPORT_GLOBAL_RESERVED_BYTES
  - CRATE_FEDERATION_IMPORT_LEASE_SECONDS
  - CRATE_FEDERATION_IMPORT_MAX_BYTES
  - CRATE_FEDERATION_IMPORT_PEER_RESERVED_BYTES
  - CRATE_LISTEN_IMAGE
  - CRATE_MAINTENANCE_WINDOW_ENABLED
  - CRATE_MAINTENANCE_WINDOW_END
  - CRATE_MAINTENANCE_WINDOW_FINGERPRINT_LIMIT
  - CRATE_MAINTENANCE_WINDOW_START
  - CRATE_MCP_HEALTH_FRESH_SECONDS
