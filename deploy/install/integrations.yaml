# Crate installation manifest.
#
# Single source of truth for the configuration the `crate` installer writes
# to `.env`. Every variable docker-compose.home.yaml reads is declared here,
# and app/installer tests fail when the two drift apart.
#
#   core          values the wizard asks for or derives from the answers
#   generated     secrets created once and kept when the install is reconfigured
#   tuning        knobs with safe compose defaults; never asked
#   integrations  optional features the user can enable, with their variables

version: 1

core:
  - env: TZ
    label: Timezone
  - env: PUID
    label: User id that owns the files
  - env: PGID
    label: Group id that owns the files
  - env: DOCKER_GID
    label: Group id of the Docker socket
  - env: MUSIC_DIR
    label: Music library
  - env: DATA_DIR
    label: Crate data
  - env: CACHE_DIR
    label: Transcode and artwork cache
  - env: DOWNLOADS_DIR
    label: Downloads waiting to be imported
  - env: DOMAIN
    label: Base domain
  - env: CRATE_LISTEN_PUBLIC_BASE_URL
    label: Public Listen URL
  - env: CRATE_PUBLIC_API_BASE_URL
    label: Public API URL
  - env: CRATE_INSTANCE_NAME
    label: Instance name
  - env: CRATE_ACCESS_MODE
    label: Access mode
    installer_only: true
  - env: CRATE_LOCAL_DOMAIN
    label: Local domain
    installer_only: true
  # Read by the docker compose CLI itself, not interpolated in the file.
  - env: COMPOSE_PROFILES
    label: Optional services
    installer_only: true
  - env: CF_DNS_API_TOKEN
    label: Cloudflare DNS API token
    secret: true
  - env: TRAEFIK_HTTP_PORT
    label: HTTP port
  - env: TRAEFIK_HTTPS_PORT
    label: HTTPS port
  - env: TRAEFIK_TLS_ENABLED
    label: HTTPS through Traefik
  - env: TRAEFIK_SECURE_ENTRYPOINT
    label: Traefik secure entrypoint
  - env: TRAEFIK_CERT_RESOLVER
    label: Traefik certificate resolver
  - env: CRATE_API_PORT
    label: API port
  - env: CRATE_ADMIN_PORT
    label: Admin port
  - env: CRATE_LISTEN_PORT
    label: Listen port
  - env: CRATE_IMAGE_TAG
    label: Image tag
  - env: CRATE_IMAGE_OWNER
    label: Image owner
  - env: CRATE_IMAGE_REGISTRY
    label: Image registry
  - env: CRATE_CONFIG_FILE
    label: Crate config file
  - env: POSTGRES_SUPERUSER_USER
    label: Postgres superuser
  - env: POSTGRES_SUPERUSER_DB
    label: Postgres superuser database
  - env: CRATE_POSTGRES_USER
    label: Postgres user
  - env: CRATE_POSTGRES_DB
    label: Postgres database
  - env: DEFAULT_ADMIN_PASSWORD
    label: Initial admin password
    secret: true

generated:
  - env: JWT_SECRET
    format: hex32
  - env: CRATE_POSTGRES_PASSWORD
    format: hex16
  - env: POSTGRES_SUPERUSER_PASSWORD
    format: same:CRATE_POSTGRES_PASSWORD
  - env: REDIS_PASSWORD
    format: hex32
  - env: CRATE_READPLANE_SERVICE_TOKEN
    format: hex32
  - env: CRATE_CREDENTIAL_KEY
    format: fernet
  - env: CRATE_FEDERATION_SUBJECT_SECRET
    format: hex32
  - env: CRATE_FEDERATION_CURSOR_SECRET
    format: hex32

tuning:
  - ANALYSIS_LEGACY_POOL_MAXCONN
  - ANALYSIS_SQLALCHEMY_MAX_OVERFLOW
  - ANALYSIS_SQLALCHEMY_POOL_SIZE
  - ANALYSIS_WORKER_PROCESSES
  - CRATE_ANALYSIS_WORKER_IMAGE
