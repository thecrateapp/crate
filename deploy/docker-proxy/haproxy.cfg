global
  maxconn 32
  nbthread 1
defaults
  mode http
  timeout connect 3s
  timeout client 60s
  timeout server 60s
frontend docker_api
  bind :2375
  http-request allow if { method GET } { path -m reg ^/(v1\.[0-9]{1,3}/)?(_ping|info|containers/json|containers/[A-Za-z0-9][A-Za-z0-9_.-]{0,127}/(json|logs))$ }
  http-request allow if { method POST } { path -m reg ^/(v1\.[0-9]{1,3}/)?containers/((librarian-|tidalrr|slskd|soulsync|traefik|nginx)[A-Za-z0-9_.-]{0,127}/(restart|stop|start)|crate-worker/restart)$ }
  http-request deny
  default_backend docker
backend docker
  server docker /var/run/docker.sock
