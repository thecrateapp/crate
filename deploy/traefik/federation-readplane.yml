http:
  services:
    crate-readplane-stream:
      failover:
        service: crate-readplane-primary
        fallback: crate-api-stream-fallback

    crate-readplane-primary:
      loadBalancer:
        servers:
          - url: http://crate-readplane:8686
        healthCheck:
          path: /readyz
          interval: 5s
          timeout: 2s

    crate-api-stream-fallback:
      loadBalancer:
        servers:
          - url: http://crate-api:8585
        healthCheck:
          path: /api/status
          interval: 5s
          timeout: 2s
