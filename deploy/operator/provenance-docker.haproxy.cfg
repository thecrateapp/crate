global
  maxconn 32
defaults
  mode http
  timeout connect 5s
  timeout client 15s
  timeout server 15s
frontend inspect
  bind :2375
  http-request deny unless { method GET } { path -m reg ^/(v1\.[0-9]{1,3}/)?(containers/json|images/sha256:[0-9a-f]{64}/json)$ }
  default_backend docker
backend docker
  server docker /var/run/docker.sock
