name: Frontend Tests

on:
  workflow_dispatch:
    inputs:
      update_visual:
        description: Record Listen and Admin baselines for review
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "app/shared/**"
      - "app/cast-receiver/**"
      - "app/ui/**"
      - "app/listen/**"
      - "app/listen-desktop/**"
      - "app/docs/**"
      - "app/site/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/design-system/**"
      - "tools/crate-ui-showcase/**"
      - "playwright.appearance.config.ts"
      - "playwright.listen-visual.config.ts"
      - "playwright.admin.config.ts"
      - "tests/appearance/**"
      - "tests/listen-visual/**"
      - "tests/admin-e2e/**"
      - "tests/visual/**"

      - "docker-compose*.yaml"
      - ".github/workflows/build-images.yml"
      - "app/tests/test_frontend_image_lockfile_contract.py"
      - ".github/workflows/test-frontend.yml"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "app/shared/**"
      - "app/cast-receiver/**"
      - "app/ui/**"
      - "app/listen/**"
      - "app/listen-desktop/**"
      - "app/docs/**"
      - "app/site/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/design-system/**"
      - "tools/crate-ui-showcase/**"
      - "playwright.appearance.config.ts"
      - "playwright.listen-visual.config.ts"
      - "playwright.admin.config.ts"
      - "tests/appearance/**"
      - "tests/listen-visual/**"
      - "tests/admin-e2e/**"
      - "tests/visual/**"

      - "docker-compose*.yaml"
      - ".github/workflows/build-images.yml"
      - "app/tests/test_frontend_image_lockfile_contract.py"
      - ".github/workflows/test-frontend.yml"

jobs:
  test:
    if: ${{ !inputs.update_visual }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check shared component catalogue
        env:
          SHOWCASE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: npm run design-system:showcase:check -- --base "$SHOWCASE_BASE_REF"

      # The ui, listen and cast-receiver images send an allowlisted context,
      # so a new shared import must be added to their Dockerfile.dockerignore.
      # Backend Tests only run on backend paths, so check it here too.
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Frontend image lockfile contract
        run: |
          python -m pip install pytest pyyaml
          python -m pytest app/tests/test_frontend_image_lockfile_contract.py -q --noconftest

      - name: Install auxiliary frontend dependencies
        run: |
          npm ci --prefix app/site
          npm ci --prefix app/docs

      - name: Test and build marketing site
        env:
          SENTRY_ORG: ninja-development
          SENTRY_PROJECT: crate-site
          SENTRY_RELEASE: crate-${{ github.sha }}
          VITE_SENTRY_DSN: ${{ vars.SENTRY_SITE_DSN }}
          VITE_SENTRY_ENVIRONMENT: production
          VITE_SENTRY_RELEASE: crate-${{ github.sha }}
          VITE_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.SENTRY_PUBLIC_SITE_TRACES_SAMPLE_RATE || '0.02' }}
        run: |
          npm test --prefix app/site
          npm run build --prefix app/site

      - name: Test and build docs site
        env:
          SENTRY_ORG: ninja-development
          SENTRY_PROJECT: crate-docs
          SENTRY_RELEASE: crate-${{ github.sha }}
          VITE_SENTRY_DSN: ${{ vars.SENTRY_DOCS_DSN }}
          VITE_SENTRY_ENVIRONMENT: production
          VITE_SENTRY_RELEASE: crate-${{ github.sha }}
          VITE_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.SENTRY_PUBLIC_SITE_TRACES_SAMPLE_RATE || '0.02' }}
        run: |
          npm run check:docs --prefix app/docs
          npm test --prefix app/docs
          npm run build --prefix app/docs

      - name: Type check shared UI
        run: npm run --workspace=@crate/ui typecheck

      - name: Test shared UI (@crate/ui)
        run: npm run --workspace=@crate/ui test

      - name: Type check Cast protocol
        run: npm run --workspace=app/shared/cast typecheck

      - name: Test Cast protocol
        run: npm run --workspace=app/shared/cast test

      - name: Type check Cast receiver
        run: npm run --workspace=app/cast-receiver typecheck

      - name: Lint Cast receiver
        run: npm run --workspace=app/cast-receiver lint

      - name: Test Cast receiver
        run: npm run --workspace=app/cast-receiver test

      - name: Build Cast receiver
        env:
          SENTRY_ORG: ninja-development
          SENTRY_PROJECT: crate-cast-receiver
          SENTRY_RELEASE: cast-receiver-${{ github.sha }}
          VITE_SENTRY_DSN: ${{ vars.SENTRY_CAST_RECEIVER_DSN }}
          VITE_SENTRY_ENVIRONMENT: production
          VITE_SENTRY_RELEASE: cast-receiver-${{ github.sha }}
          VITE_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.SENTRY_CAST_RECEIVER_TRACES_SAMPLE_RATE || '0.05' }}
        run: |
          npm run --workspace=app/cast-receiver build
          npm run --workspace=app/cast-receiver check:bundle

      - name: Type check admin UI
        run: npm run --workspace=app/ui typecheck

      - name: Lint admin UI
        run: npm run --workspace=app/ui lint

      - name: Test admin UI (crate-ui)
        run: npm run --workspace=app/ui test

      - name: Build admin UI
        env:
          SENTRY_ORG: ninja-development
          SENTRY_PROJECT: crate-admin
          SENTRY_RELEASE: crate-${{ github.sha }}
          VITE_SENTRY_DSN: ${{ vars.SENTRY_ADMIN_DSN }}
          VITE_SENTRY_ENVIRONMENT: production
          VITE_SENTRY_RELEASE: crate-${{ github.sha }}
        run: |
          npm run --workspace=app/ui build
          npm run --workspace=app/ui check:bundle

      - name: Type check listen app
        run: npm run --workspace=app/listen typecheck

      - name: Lint listen app
        run: npm run --workspace=app/listen lint

      - name: Check Listen i18n catalogs
        run: npm run --workspace=app/listen i18n:check

      - name: Test listen app
        run: npm run --workspace=app/listen test

      - name: Test design-system tooling
        run: node --test scripts/design-system/*.test.mjs

      - name: Check design-system drift budget
        run: npm run design-system:drift -- --check

      - name: Check shared component override budget
        run: npm run design-system:overrides -- --check

      - name: Check generated appearance tokens
        run: npm run design-system:tokens:check

      - name: Check shared UI layer boundaries
        run: npm run design-system:layers

      - name: Build Listen
        env:
          SENTRY_ORG: ninja-development
          SENTRY_PROJECT: crate-listen
          SENTRY_RELEASE: crate-${{ github.sha }}
          VITE_SENTRY_DSN: ${{ vars.SENTRY_LISTEN_DSN }}
          VITE_SENTRY_ENVIRONMENT: production
          VITE_SENTRY_RELEASE: crate-${{ github.sha }}
        run: |
          npm run --workspace=app/listen build
          npm run --workspace=app/listen check:bundle

      - name: Type check desktop app
        run: npm run --workspace=app/listen-desktop typecheck

      - name: Test desktop app
        run: npm run --workspace=app/listen-desktop test

  appearance-chromium:
    if: ${{ !inputs.update_visual }}
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      CRATE_PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run appearance contracts
        run: npm run test:appearance -- --project=chromium

      - name: Run real Listen visual regression
        run: npm run test:listen-visual

      - name: Run admin end-to-end flows
        run: npm run test:admin-e2e

      - name: Upload appearance report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: appearance-chromium-report
          path: |
            playwright-report/appearance/
            playwright-report/listen-visual/
            playwright-report/admin-e2e/
            test-results/appearance/
            test-results/listen-visual/
            test-results/admin-e2e/

  update-listen-visual:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_visual }}
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    permissions:
      contents: read
    env:
      CRATE_PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Record Listen baselines
        run: npm run test:listen-visual -- --update-snapshots --workers=2

      - name: Record Admin baselines
        run: npm run test:admin-e2e -- --update-snapshots --workers=2

      - name: Identify capture source
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          writeFileSync('tests/capture-manifest.json', JSON.stringify({
            commit: process.env.GITHUB_SHA,
            image: process.env.CRATE_PLAYWRIGHT_IMAGE,
            platform: process.platform,
            arch: process.arch,
          }, null, 2) + '\n');
          JS

      - name: Upload baselines for review
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-${{ github.sha }}
          if-no-files-found: error
          path: |
            tests/listen-visual/**/*-snapshots/*.png
            tests/admin-e2e/**/*-snapshots/*.png
            tests/capture-manifest.json

      - name: Upload capture diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-capture-report-${{ github.sha }}
          path: |
            playwright-report/listen-visual/
            playwright-report/admin-e2e/
            test-results/listen-visual/
            test-results/admin-e2e/
