name: Build multi-arch image

# Builds one image for linux/amd64 and linux/arm64 on native runners, pushes
# each by digest and joins them in one manifest list tagged with the commit.
on:
  workflow_call:
    inputs:
      image:
        description: Image name under ghcr.io/<owner>/
        type: string
        required: true
      context:
        type: string
        default: ./app
      file:
        type: string
        default: ./app/Dockerfile
      target:
        type: string
        default: ""
      cache-scope:
        type: string
        required: true
      build-args:
        type: string
        default: ""
      crate-cli:
        description: Build crate-cli for each architecture into app/bin first
        type: boolean
        default: false
    outputs:
      digest:
        description: Digest of the multi-arch manifest list
        value: ${{ jobs.merge.outputs.digest }}

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build crate-cli for ${{ matrix.arch }}
        if: inputs.crate-cli
        run: |
          mkdir -p app/bin /tmp/crate-cli-build
          docker build --platform "${{ matrix.platform }}" --output type=local,dest=/tmp/crate-cli-build tools/crate-cli
          cp /tmp/crate-cli-build/crate-cli "app/bin/crate-cli-linux-${{ matrix.arch }}"
          chmod +x "app/bin/crate-cli-linux-${{ matrix.arch }}"

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ inputs.image }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          target: ${{ inputs.target }}
          platforms: ${{ matrix.platform }}
          build-args: ${{ inputs.build-args }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ inputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ inputs.cache-scope }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ inputs.cache-scope }}-${{ matrix.arch }},mode=max,ignore-error=true

      - name: Keep the digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ inputs.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.inspect.outputs.digest }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digests-${{ inputs.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ inputs.image }}
          tags: |
            type=sha,prefix=,format=long

      - name: Create the manifest list
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ inputs.image }}
        run: |
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $tags $(printf "${IMAGE}@sha256:%s " *)

      - name: Read the manifest list digest
        id: inspect
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ inputs.image }}
        run: |
          digest=$(docker buildx imagetools inspect "${IMAGE}:${{ github.sha }}" --format '{{json .Manifest}}' | jq -r .digest)
          test -n "$digest" && test "$digest" != null
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "${IMAGE}:${{ github.sha }}"
