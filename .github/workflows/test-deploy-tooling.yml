name: Deploy tooling

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/deploy-remote.sh"
      - "app/tests/test_deploy_release_commands.py"
      - "scripts/application_orphans.py"
      - "app/tests/test_application_orphans.py"
      - "deploy/operator/compose.operator.yaml"
      - "app/installer/internal/assets/files/compose.operator.yaml"
      - "docker-compose.yaml"
      - ".github/workflows/test-deploy-tooling.yml"
  push:
    branches: [main]
    paths:
      - "scripts/deploy-remote.sh"
      - "app/tests/test_deploy_release_commands.py"
      - "scripts/application_orphans.py"
      - "app/tests/test_application_orphans.py"
      - "deploy/operator/compose.operator.yaml"
      - "app/installer/internal/assets/files/compose.operator.yaml"
      - "docker-compose.yaml"
      - ".github/workflows/test-deploy-tooling.yml"

permissions:
  contents: read

concurrency:
  group: deploy-tooling-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install pytest==8.4.2 PyYAML==6.0.3
      - name: Validate deploy script and orphan retirement contracts
        run: >-
          python -m pytest --noconftest
          app/tests/test_deploy_release_commands.py
          app/tests/test_application_orphans.py -q
