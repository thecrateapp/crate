name: Native Tool Tests

on:
  push:
    branches: [main]
    paths:
      - "app/crate/smart_mix/**"
      - "app/tests/test_smart_mix_rust_parity.py"
      - "app/media-worker/**"
      - "tools/crate-cli/**"
      - "app/listen-desktop/src-tauri/src/**"
      - "app/Dockerfile"
      - ".github/workflows/test-native-tools.yml"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "app/crate/smart_mix/**"
      - "app/tests/test_smart_mix_rust_parity.py"
      - "app/media-worker/**"
      - "tools/crate-cli/**"
      - "app/listen-desktop/src-tauri/src/**"
      - "app/Dockerfile"
      - ".github/workflows/test-native-tools.yml"

jobs:
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: |
          cargo fmt --manifest-path app/media-worker/Cargo.toml --all -- --check
          cargo fmt --manifest-path tools/crate-cli/Cargo.toml --all -- --check
          cargo fmt --manifest-path app/listen-desktop/src-tauri/Cargo.toml --all -- --check

      - name: Clippy media-worker
        run: cargo clippy --locked --manifest-path app/media-worker/Cargo.toml --all-targets -- -D warnings

  crate-cli:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Run crate-cli tests
        run: |
          docker run --rm \
            --platform linux/amd64 \
            -v "${{ github.workspace }}/tools/crate-cli:/src" \
            -w /src \
            -e DEBIAN_FRONTEND=noninteractive \
            -e CARGO_TARGET_DIR=/tmp/crate-cli-target \
            rust:1.88-trixie \
            bash -lc "apt-get update && apt-get install -y --no-install-recommends pkg-config libssl-dev build-essential libsqlite3-dev && /usr/local/cargo/bin/cargo test --locked"

      - name: Build production crate-cli Linux binary
        run: |
          docker build --platform linux/amd64 --output type=local,dest=/tmp/crate-cli-build tools/crate-cli
          test -x /tmp/crate-cli-build/crate-cli

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: app/requirements*.txt

      - name: Check Python and Rust Smart Mix parity
        working-directory: app
        env:
          CRATE_CLI_BINARY: /tmp/crate-cli-build/crate-cli
          CRATE_REQUIRE_CRATE_CLI: "1"
        run: |
          pip install -r requirements-test.txt "librosa>=0.10"
          python -m pytest tests/test_smart_mix_rust_parity.py -q

  media-worker:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Run media-worker tests
        run: |
          docker run --rm \
            --platform linux/amd64 \
            -v "${{ github.workspace }}/app/media-worker:/src" \
            -w /src \
            -e CARGO_TARGET_DIR=/tmp/media-worker-target \
            rust:1.88-slim \
            /usr/local/cargo/bin/cargo test --locked

      - name: Build media-worker image
        uses: docker/build-push-action@v7
        with:
          context: ./app
          file: ./app/Dockerfile
          target: media-worker
          push: false
          tags: crate-media-worker:ci

  coverage:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Install system deps (crate-cli)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libsqlite3-dev

      - name: Run crate-cli tests with coverage
        working-directory: tools/crate-cli
        run: cargo llvm-cov --locked --lcov --output-path lcov.info

      - name: Run media-worker tests with coverage
        working-directory: app/media-worker
        run: cargo llvm-cov --locked --lcov --output-path lcov.info

      - name: Upload coverage reports to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v5
        with:
          files: tools/crate-cli/lcov.info,app/media-worker/lcov.info
          flags: rust
