name: Installer

on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - "app/installer/**"
      - "deploy/install/**"
      - "docker-compose.home.yaml"
      - "app/config.yaml"
      - "deploy/traefik/federation-readplane.yml"
      - "scripts/agent_setup.py"
      - "deploy/hermes/runtime.py"
      - "deploy/operator/compose.operator.yaml"
      - "deploy/operator/config.operator.example.json"
      - "install.sh"
      - ".env.example"
      - "README.md"
      - ".github/workflows/build-installer.yml"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "app/installer/**"
      - "deploy/install/**"
      - "docker-compose.home.yaml"
      - "app/config.yaml"
      - "deploy/traefik/federation-readplane.yml"
      - "scripts/agent_setup.py"
      - "deploy/hermes/runtime.py"
      - "deploy/operator/compose.operator.yaml"
      - "deploy/operator/config.operator.example.json"
      - "install.sh"
      - ".env.example"
      - "README.md"
      - ".github/workflows/build-installer.yml"

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app/installer
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: app/installer/go.mod
          cache-dependency-path: app/installer/go.sum

      - name: Embedded files match the repository
        run: |
          go generate ./...
          git diff --exit-code -- internal/assets/files

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Bootstrap script syntax
        working-directory: .
        run: bash -n install.sh

  tag-images:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      OWNER: ${{ github.repository_owner }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the release manifest of the tagged commit
        env:
          MANIFEST_REPOSITORY: ${{ env.REGISTRY }}/${{ env.OWNER }}/crate-release-manifest
        run: |
          set -Eeuo pipefail
          release_sha="$(git rev-parse HEAD)"
          manifest_image="${MANIFEST_REPOSITORY}:${release_sha}"
          if ! docker pull -q "$manifest_image" >/dev/null 2>&1; then
            echo "::error::No release manifest for ${release_sha} (${manifest_image}). Tag a commit whose \"Build & Push Docker Images\" run on main has finished, then re-run this job."
            exit 1
          fi
          container="$(docker create "$manifest_image" true)"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker cp "$container:/release-manifest.json" /tmp/release-manifest.json
          python scripts/release_manifest.py validate \
            --manifest /tmp/release-manifest.json \
            --release-sha "$release_sha" \
            --registry "$REGISTRY" \
            --owner "$OWNER"

      - name: Tag every release image with the version
        run: |
          set -Eeuo pipefail
          refs="$(python scripts/release_manifest.py refs \
            --manifest /tmp/release-manifest.json)"
          if ! grep -q '/crate-agent@' <<<"$refs"; then
            echo "::warning::The release manifest has no crate-agent image, so crate-agent:${RELEASE_TAG} will not exist."
          fi
          while IFS= read -r reference; do
            repository="${reference%@*}"
            digest="${reference#*@}"
            target="${repository}:${RELEASE_TAG}"
            current="$(docker buildx imagetools inspect "$target" \
              --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"' || true)"
            if [[ "$current" == "$digest" ]]; then
              echo "${target} already points to ${digest}"
              continue
            fi
            if [[ -n "$current" ]]; then
              echo "::error::${target} already points to ${current}, not ${digest}. Release tags are never moved."
              exit 1
            fi
            docker buildx imagetools create --tag "$target" "$reference"
          done <<<"$refs"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, tag-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: app/installer/go.mod
          cache-dependency-path: app/installer/go.sum

      - name: Build
        working-directory: app/installer
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p ../../installer-artifacts
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "../../installer-artifacts/crate-${os}-${arch}" ./cmd/crate
          done
          cd ../../installer-artifacts
          sha256sum crate-* > crate-checksums.txt

      - name: Attach the installer to the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          files: installer-artifacts/*
