name: Backend Tests

on:
  push:
    branches: [main]
    paths:
      - "app/crate/**"
      - "app/tests/**"
      - "app/requirements*.txt"
      - ".github/workflows/test-backend.yml"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "app/crate/**"
      - "app/tests/**"
      - "app/requirements*.txt"
      - ".github/workflows/test-backend.yml"

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: security scan (changed Python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Bandit
        run: pip install bandit==1.9.4

      - name: Scan changed backend files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mapfile -t changed_files < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- app/crate | grep -E '\.py$' || true)
          if (( ${#changed_files[@]} == 0 )); then
            mapfile -t changed_files < <(git ls-files app/crate | grep -E '\.py$')
          fi
          python -m bandit -q --exit-zero -f json -o bandit-changed-python.json "${changed_files[@]}"
          python -m bandit -q --severity-level medium --confidence-level high "${changed_files[@]}"

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-changed-python
          path: bandit-changed-python.json
          if-no-files-found: warn
          retention-days: 30

  quality:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: app/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pyright==1.1.411 ruff==0.15.22
        working-directory: app

      - name: Type check
        run: python -m pyright

      - name: Ruff check
        run: python -m ruff check crate tests
        working-directory: app

      - name: Ruff format check
        run: python -m ruff format --check crate tests
        working-directory: app

  tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    name: tests (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      max-parallel: 8
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: crate
          POSTGRES_PASSWORD: crate
          POSTGRES_DB: crate_test
        options: >-
          --health-cmd "pg_isready -U crate -d crate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: app/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-test.txt
        working-directory: app

      - name: Run test shard with coverage
        env:
          CRATE_POSTGRES_USER: crate
          CRATE_POSTGRES_PASSWORD: crate
          CRATE_POSTGRES_HOST: localhost
          CRATE_POSTGRES_PORT: "5432"
          CRATE_POSTGRES_DB: crate_test
          POSTGRES_SUPERUSER_USER: crate
          POSTGRES_SUPERUSER_PASSWORD: crate
          POSTGRES_SUPERUSER_DB: crate_test
          COVERAGE_FILE: .coverage.${{ matrix.shard }}
        run: |
          python -m pytest tests/ -q \
            --ignore=tests/test_stats_integration.py \
            --ignore=tests/test_user_stats_aggregates.py \
            --tb=short \
            --splits 8 \
            --group ${{ matrix.shard }} \
            --splitting-algorithm least_duration \
            --durations-path=${{ github.workspace }}/app/tests/.test_durations \
            --cov=crate \
            --cov-report=
        working-directory: app

      - name: Upload raw coverage
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-${{ matrix.shard }}
          path: app/.coverage.${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  coverage:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    name: coverage
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install coverage
        run: pip install coverage

      - name: Download raw coverage
        uses: actions/download-artifact@v4
        with:
          pattern: python-coverage-*
          path: app/coverage-data
          merge-multiple: true

      - name: Combine and enforce coverage
        run: |
          python -m coverage combine coverage-data
          python -m coverage report --fail-under=50
          python -m coverage xml -o coverage.xml
        working-directory: app

      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: app/coverage.xml
          flags: python
