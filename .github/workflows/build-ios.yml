name: Build iOS

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/build-ios.yml"
      - "app/listen/**"
      - "app/shared/**"
      - "package-lock.json"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - ".github/workflows/build-ios.yml"
      - "app/listen/**"
      - "app/shared/**"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  simulator:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: macos-15
    env:
      CRATE_MOBILE_RELEASE: "true"
      CRATE_REQUIRE_CUSTOM_CAST_RECEIVER: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
      CRATE_CAST_RECEIVER_APP_ID: ${{ vars.CAST_RECEIVER_APP_ID || 'CC1AD845' }}
      VITE_CAST_CUSTOM_RECEIVER_ENABLED: ${{ vars.CAST_CUSTOM_RECEIVER_ENABLED || 'false' }}
      VITE_CAST_RECEIVER_APP_ID: ${{ vars.CAST_RECEIVER_APP_ID || 'CC1AD845' }}
      VITE_CRATE_CONNECT_FEATURE_ENABLED: ${{ vars.CRATE_CONNECT_FEATURE_ENABLED || 'false' }}
      VITE_LISTEN_APPEARANCE_SETTINGS_ENABLED: ${{ vars.LISTEN_APPEARANCE_SETTINGS_ENABLED || 'false' }}
      VITE_SENTRY_DSN: ${{ vars.SENTRY_LISTEN_DSN }}
      VITE_SENTRY_ENVIRONMENT: production
      VITE_SENTRY_RELEASE: crate-${{ github.sha }}
      VITE_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.SENTRY_LISTEN_TRACES_SAMPLE_RATE || '0.1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Listen dependencies
        run: npm ci

      - name: Test iOS bridge contracts
        run: >-
          npm run test -- --run
          src/lib/cast-sender.test.ts
          src/lib/native-media-session.test.ts
          src/lib/native-secure-session.test.ts
          src/lib/capacitor.test.ts
        working-directory: app/listen

      - name: Validate secure release configuration
        run: node scripts/assert-release-mobile-config.mjs
        working-directory: app/listen

      - name: Test bounded iOS artwork decoding
        run: app/listen/scripts/test-ios-artwork-downsample.sh

      - name: Test iOS secure-session Keychain round trip
        run: app/listen/scripts/test-ios-secure-session.sh

      - name: Test iOS offline asset integrity check
        run: app/listen/scripts/test-ios-offline-integrity.sh

      - name: Test iOS media-session interruption state
        run: app/listen/scripts/test-ios-media-session-interruption.sh

      - name: Test iOS media-session artwork state
        run: app/listen/scripts/test-ios-media-session-artwork.sh

      - name: Build and sync Capacitor bundle
        env:
          SENTRY_AUTH_TOKEN: ${{ github.event_name == 'push' && secrets.SENTRY_AUTH_TOKEN || '' }}
          SENTRY_ORG: ninja-development
          SENTRY_PROJECT: crate-listen
          SENTRY_RELEASE: crate-${{ github.sha }}
        run: npm run build:cap
        working-directory: app/listen

      - name: Install CocoaPods
        run: command -v pod >/dev/null || brew install cocoapods

      - name: Install locked iOS dependencies
        run: pod install --deployment
        working-directory: app/listen/ios/App

      - name: Resolve iOS version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            IOS_MARKETING_VERSION=$(printf '%s' "$GITHUB_REF_NAME" \
              | sed -E 's/^v//' | sed -E 's/-.*$//')
          else
            IOS_MARKETING_VERSION="0.0.0"
          fi
          echo "IOS_MARKETING_VERSION=$IOS_MARKETING_VERSION" >> "$GITHUB_ENV"

      - name: Build iOS simulator app
        run: >-
          xcodebuild
          -workspace App.xcworkspace
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          CRATE_CAST_RECEIVER_APP_ID="$CRATE_CAST_RECEIVER_APP_ID"
          MARKETING_VERSION="$IOS_MARKETING_VERSION"
          CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
          build
        working-directory: app/listen/ios/App
