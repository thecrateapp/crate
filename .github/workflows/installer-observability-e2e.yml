name: Installer monitoring end to end

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release whose images are installed
        default: v3.1.3
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: app/installer/go.mod
          cache-dependency-path: app/installer/go.sum

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install, enable, disable and upgrade monitoring
        env:
          CRATE_E2E_VERSION: ${{ inputs.version || 'v3.1.3' }}
        run: make installer-observability-e2e
