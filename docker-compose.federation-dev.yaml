# Federation development harness — two local Crate nodes for protocol work.
# Usage: make federation-dev-up
#
# Coexistence: uses dedicated compose project (COMPOSE_PROJECT_NAME=crate-federation-dev)
# and non-overlapping ports so the normal `make dev` stack can run alongside.
#
# Node A: API :18585, Admin :15173, Listen :15174, PG :15433, Redis :16380
# Node B: API :28585, PG :25433, Redis :26380

name: crate-federation-dev

networks:
  fed-net:

services:
  stream-benchmark:
    profiles: ["benchmark"]
    build:
      context: ./app
      target: api
    entrypoint: ["python"]
    command:
      - /app/tests/load/federation_stream_benchmark.py
      - --file-mib
      - "8"
      - --concurrency
      - 1,10,25,50
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./app/crate:/app/crate:ro
      - ./app/tests:/app/tests:ro
    networks:
      - fed-net
    mem_limit: 768m
    cpus: "1.0"

  # ── Node A ──────────────────────────────────────────────────────────────

  node-a-postgres:
    image: pgvector/pgvector:pg15
    container_name: fed-a-postgres
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=10000
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
    environment:
      - POSTGRES_USER=crate
      - POSTGRES_PASSWORD=crate
      - POSTGRES_DB=crate
    volumes:
      - fed_a_postgres:/var/lib/postgresql/data
    ports:
      - "15433:5432"
    networks:
      - fed-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crate -d crate"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  node-a-redis:
    image: redis:7-alpine
    container_name: fed-a-redis
    command: redis-server --maxmemory 128mb --maxmemory-policy volatile-lru --requirepass redis-dev
    ports:
      - "16380:6379"
    networks:
      - fed-net
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "redis-dev" ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 3s

  node-a-redis-durable:
    image: redis:7-alpine
    container_name: fed-a-redis-durable
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory 128mb --maxmemory-policy noeviction --requirepass redis-dev
    volumes:
      - fed_a_redis_durable:/data
    networks:
      - fed-net
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "redis-dev" ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 3s

  node-a-api:
    build:
      context: ./app
      target: api
    container_name: fed-a-api
    environment:
      - TZ=Europe/Madrid
      - CRATE_CONFIG=/app/config.yaml
      - DATA_DIR=/data
      - CRATE_POSTGRES_USER=crate
      - CRATE_POSTGRES_PASSWORD=crate
      - CRATE_POSTGRES_DB=crate
      - CRATE_POSTGRES_HOST=node-a-postgres
      - POSTGRES_SUPERUSER_USER=crate
      - POSTGRES_SUPERUSER_PASSWORD=crate
      - POSTGRES_SUPERUSER_DB=crate
      - CRATE_RUNTIME=api
      - CRATE_INSTANCE_NAME=Federation Node A
      - CRATE_PUBLIC_API_BASE_URL=http://node-a-api:8585
      - DOMAIN=node-a.federation.local
      - CRATE_FEDERATION_SUBJECT_SECRET=fed-dev-node-a-subject-secret-000000
      - CRATE_FEDERATION_DEV_ALLOW_HTTP=true
      - CRATE_FEDERATION_DEV_ALLOW_PRIVATE_NETWORKS=true
      - CRATE_FEDERATION_IMPORT_MAX_BYTES=2147483648
      - CRATE_FEDERATION_IMPORT_PEER_RESERVED_BYTES=4294967296
      - CRATE_FEDERATION_IMPORT_GLOBAL_RESERVED_BYTES=8589934592
      - CRATE_FEDERATION_IMPORT_FREE_HEADROOM_BYTES=16777216
      - CRATE_FEDERATION_IMPORT_LEASE_SECONDS=900
      - CRATE_AUTH_COOKIE_DOMAIN=
      - CRATE_AUTH_COOKIE_SECURE=false
      - CRATE_AUTH_COOKIE_SAMESITE=lax
      - JWT_SECRET=fed-dev-node-a-jwt-secret-at-least-32-bytes
      - DEFAULT_ADMIN_PASSWORD=admin
      - NUMBA_CACHE_DIR=/tmp/numba_cache
      - REDIS_URL=redis://:redis-dev@node-a-redis:6379/0
      - REDIS_CACHE_URL=redis://:redis-dev@node-a-redis:6379/0
      - REDIS_DURABLE_URL=redis://:redis-dev@node-a-redis-durable:6379/0
      - CRATE_METRICS_REDIS_TTL_SECONDS=86400
      - CRATE_SSE_REDIS_MAX_CONNECTIONS=32
      - CRATE_BANDCAMP_WEB_CREDENTIAL_BRIDGE_ENABLED=false
      - LASTFM_APIKEY=${LASTFM_APIKEY:-}
      - LASTFM_API_SECRET=${LASTFM_API_SECRET:-}
      - FANART_API_KEY=${FANART_API_KEY:-}
      - SPOTIFY_ID=${SPOTIFY_ID:-}
      - SPOTIFY_SECRET=${SPOTIFY_SECRET:-}
      - SETLISTFM_API_KEY=${SETLISTFM_API_KEY:-}
      - TICKETMASTER_API_KEY=${TICKETMASTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AUDIOMUSE_GEMINI_API_KEY=${AUDIOMUSE_GEMINI_API_KEY:-}
      - OLLAMA_URL=${OLLAMA_URL:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini/gemini-2.5-flash}
      - SLSKD_URL=http://slskd:5030
      - SLSKD_API_KEY=
      - CRATE_MEDIA_WORKER_URL=http://media-worker:8687
      - CRATE_MEDIA_WORKER_MAX_ACTIVE=1
      - CRATE_READPLANE_SERVICE_TOKEN=fed-dev-node-a-readplane-service-token-000000
    volumes:
      - ./app/crate:/app/crate:ro
      - ./app/tests:/app/tests:ro
      - ./app/config.yaml:/app/config.yaml:ro
      - ./test-music-federation/node-a:/music:ro
      - fed_a_data:/data
    ports:
      - "18585:8585"
    networks:
      fed-net:
        aliases:
          - node-a-api
          # The Listen nginx image proxies /api to http://crate-api:8585.
          - crate-api
    depends_on:
      node-a-postgres:
        condition: service_healthy
      node-a-redis:
        condition: service_healthy
      node-a-redis-durable:
        condition: service_healthy
    mem_limit: 512m
    mem_reservation: 192m
    cpus: "0.75"
    command: ["api"]

  node-a-readplane:
    build:
      context: ./app/readplane
    container_name: fed-a-readplane
    environment:
      - READPLANE_ADDR=:8686
      - DATABASE_URL=postgresql://crate:crate@node-a-postgres:5432/crate?sslmode=disable
      - REDIS_URL=redis://:redis-dev@node-a-redis:6379/0
      - REDIS_CACHE_URL=redis://:redis-dev@node-a-redis:6379/0
      - REDIS_DURABLE_URL=redis://:redis-dev@node-a-redis-durable:6379/0
      - JWT_SECRET=fed-dev-node-a-jwt-secret-at-least-32-bytes
      - READPLANE_ENABLED=true
      - READPLANE_ENABLE_SSE=true
      - READPLANE_ROUTE_MODE=active
      - READPLANE_FALLBACK_ENABLED=true
      - READPLANE_FEDERATION_PROXY_ENABLED=true
      - READPLANE_STATS_SNAPSHOT_MAX_AGE_SECONDS=300
      - READPLANE_STATS_STALE_MAX_AGE_SECONDS=86400
      - READPLANE_SESSION_TOUCH_INTERVAL_SECONDS=60
      - READPLANE_LOCAL_MEDIA_ENABLED=${READPLANE_LOCAL_MEDIA_ENABLED:-false}
      - READPLANE_MUSIC_ROOT=/music
      - READPLANE_DATA_ROOT=/data
      - API_FALLBACK_BASE=http://node-a-api:8585
      - CRATE_READPLANE_SERVICE_TOKEN=fed-dev-node-a-readplane-service-token-000000
      - CRATE_FEDERATION_DEV_ALLOW_PRIVATE_NETWORKS=true
    volumes:
      - ./test-music-federation/node-a:/music:ro
      - fed_a_data:/data:ro
    ports:
      - "18686:8686"
    networks:
      - fed-net
    depends_on:
      node-a-postgres:
        condition: service_healthy
      node-a-redis:
        condition: service_healthy
      node-a-redis-durable:
        condition: service_healthy
      node-a-api:
        condition: service_started
    mem_limit: 128m
    mem_reservation: 32m
    cpus: "0.25"

  node-a-worker:
    build:
      context: ./app
      target: worker-core
    container_name: fed-a-worker
    environment:
      - TZ=Europe/Madrid
      - CRATE_CONFIG=/app/config.yaml
      - DATA_DIR=/data
      - CRATE_POSTGRES_USER=crate
      - CRATE_POSTGRES_PASSWORD=crate
      - CRATE_POSTGRES_DB=crate
      - CRATE_POSTGRES_HOST=node-a-postgres
      - POSTGRES_SUPERUSER_USER=crate
      - POSTGRES_SUPERUSER_PASSWORD=crate
      - POSTGRES_SUPERUSER_DB=crate
      - CRATE_RUNTIME=worker
      - CRATE_WORKER_PROCESSES=1
      - FAST_WORKER_PROCESSES=1
      - MAINTENANCE_WORKER_PROCESSES=1
      - DOMAIN=node-a.federation.local
      - CRATE_FEDERATION_SUBJECT_SECRET=fed-dev-node-a-subject-secret-000000
      - CRATE_FEDERATION_DEV_ALLOW_HTTP=true
      - CRATE_FEDERATION_DEV_ALLOW_PRIVATE_NETWORKS=true
      - CRATE_FEDERATION_IMPORT_MAX_BYTES=2147483648
      - CRATE_FEDERATION_IMPORT_PEER_RESERVED_BYTES=4294967296
      - CRATE_FEDERATION_IMPORT_GLOBAL_RESERVED_BYTES=8589934592
      - CRATE_FEDERATION_IMPORT_FREE_HEADROOM_BYTES=16777216
      - CRATE_FEDERATION_IMPORT_LEASE_SECONDS=900
      - JWT_SECRET=fed-dev-node-a-jwt-secret-at-least-32-bytes
      - DEFAULT_ADMIN_PASSWORD=admin
      - NUMBA_CACHE_DIR=/tmp/numba_cache
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1
      - VECLIB_MAXIMUM_THREADS=1
      - REDIS_URL=redis://:redis-dev@node-a-redis:6379/0
      - REDIS_CACHE_URL=redis://:redis-dev@node-a-redis:6379/0
      - REDIS_DURABLE_URL=redis://:redis-dev@node-a-redis-durable:6379/0
      - CRATE_METRICS_REDIS_TTL_SECONDS=86400
      - CRATE_FFMPEG_THREADS=1
      - CRATE_RESOURCE_GOVERNOR_ENABLED=false
      - CRATE_BANDCAMP_DOWNLOAD_BACKEND=web
      - LASTFM_APIKEY=${LASTFM_APIKEY:-}
      - LASTFM_API_SECRET=${LASTFM_API_SECRET:-}
      - FANART_API_KEY=${FANART_API_KEY:-}
      - SPOTIFY_ID=${SPOTIFY_ID:-}
      - SPOTIFY_SECRET=${SPOTIFY_SECRET:-}
      - SETLISTFM_API_KEY=${SETLISTFM_API_KEY:-}
      - TICKETMASTER_API_KEY=${TICKETMASTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AUDIOMUSE_GEMINI_API_KEY=${AUDIOMUSE_GEMINI_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini/gemini-2.5-flash}
      - SLSKD_URL=http://slskd:5030
      - SLSKD_API_KEY=
    volumes:
      - ./app/crate:/app/crate:ro
      - ./app/tests:/app/tests:ro
      - ./app/config.yaml:/app/config.yaml:ro
      - ./test-music-federation/node-a:/music
      - fed_a_data:/data
    networks:
      - fed-net
    depends_on:
      node-a-postgres:
        condition: service_healthy
      node-a-redis:
        condition: service_healthy
      node-a-redis-durable:
        condition: service_healthy
    mem_limit: 768m
    mem_reservation: 256m
    cpus: "0.5"
    command:
      [
        "worker",
        "--queues",
        "default,fast,maintenance",
        "--processes",
        "1",
        "--no-service-loop",
        "--no-daemons",
        "--no-projector",
      ]

  node-a-listen:
    build:
      context: ./app
      dockerfile: listen/Dockerfile
    container_name: fed-a-listen
    ports:
      - "15174:80"
    networks:
      - fed-net
    depends_on:
      node-a-api:
        condition: service_started
    mem_limit: 512m
    mem_reservation: 128m
    cpus: "0.5"

  node-a-admin:
    build:
      context: ./app
      dockerfile: ui/Dockerfile
    container_name: fed-a-admin
    ports:
      - "15173:80"
    networks:
      - fed-net
    depends_on:
      node-a-api:
        condition: service_started
    mem_limit: 512m
    mem_reservation: 128m
    cpus: "0.5"

