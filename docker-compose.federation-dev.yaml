      - SLSKD_URL=http://slskd:5030
      - SLSKD_API_KEY=
      - TICKETMASTER_API_KEY=
      - CRATE_MEDIA_WORKER_URL=http://media-worker:8687
      - CRATE_MEDIA_WORKER_MAX_ACTIVE=1
    volumes:
