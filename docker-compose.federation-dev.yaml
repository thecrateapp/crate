      - CRATE_RESOURCE_GOVERNOR_ENABLED=false
      - CRATE_BANDCAMP_DOWNLOAD_BACKEND=web
      - LASTFM_APIKEY=${LASTFM_APIKEY:-}
      - LASTFM_API_SECRET=${LASTFM_API_SECRET:-}
      - FANART_API_KEY=${FANART_API_KEY:-}
      - SPOTIFY_ID=${SPOTIFY_ID:-}
      - SPOTIFY_SECRET=${SPOTIFY_SECRET:-}
      - SETLISTFM_API_KEY=${SETLISTFM_API_KEY:-}
      - TICKETMASTER_API_KEY=${TICKETMASTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AUDIOMUSE_GEMINI_API_KEY=${AUDIOMUSE_GEMINI_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini/gemini-2.5-flash}
      - SLSKD_URL=http://slskd:5030
      - SLSKD_API_KEY=
    volumes:
      - ./app/crate:/app/crate:ro
      - ./app/tests:/app/tests:ro
      - ./app/config.yaml:/app/config.yaml:ro
      - ./test-music-federation/node-b:/music
      - fed_b_data:/data
    networks:
      - fed-net
    depends_on:
      node-b-postgres:
        condition: service_healthy
      node-b-redis:
        condition: service_healthy
      node-b-redis-durable:
        condition: service_healthy
    mem_limit: 768m
    mem_reservation: 256m
    cpus: "0.5"
    command:
      [
        "worker",
        "--queues",
        "default,fast,maintenance",
        "--processes",
        "1",
        "--no-service-loop",
        "--no-daemons",
        "--no-projector",
      ]

