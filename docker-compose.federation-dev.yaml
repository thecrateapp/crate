      - JWT_SECRET=fed-dev-secret-node-b
      - DEFAULT_ADMIN_PASSWORD=admin
      - NUMBA_CACHE_DIR=/tmp/numba_cache
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1
