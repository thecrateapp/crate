      - track_io_timing=on
    environment:
      - POSTGRES_USER=crate
      - POSTGRES_PASSWORD=crate
      - POSTGRES_DB=crate
    volumes:
      - fed_b_postgres:/var/lib/postgresql/data
    ports:
      - "25433:5432"
    networks:
      - fed-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crate -d crate"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  node-b-redis:
    image: redis:7-alpine
    container_name: fed-b-redis
    command: redis-server --maxmemory 128mb --maxmemory-policy volatile-lru --requirepass redis-dev
    ports:
      - "26380:6379"
    networks:
      - fed-net
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "redis-dev" ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 3s

  node-b-api:
