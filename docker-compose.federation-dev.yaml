      - CRATE_POSTGRES_PASSWORD=crate
      - CRATE_POSTGRES_DB=crate
      - CRATE_POSTGRES_HOST=node-b-postgres
      - POSTGRES_SUPERUSER_USER=crate
      - POSTGRES_SUPERUSER_PASSWORD=crate
      - POSTGRES_SUPERUSER_DB=crate
      - CRATE_RUNTIME=api
      - CRATE_INSTANCE_NAME=Federation Node B
      - DOMAIN=node-b.federation.local
      - CRATE_FEDERATION_SUBJECT_SECRET=fed-dev-node-b-subject-secret-000000
      - CRATE_AUTH_COOKIE_DOMAIN=
      - CRATE_AUTH_COOKIE_SECURE=false
