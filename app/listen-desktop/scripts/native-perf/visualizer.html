<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crate visualizer performance probe</title>
    <style>
      :root {
        color: #e8edf2;
        background: #10151a;
        font:
          14px system-ui,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-width: 720px;
        min-height: 600px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
      }
      button {
        padding: 7px 12px;
        color: inherit;
        background: #26333d;
        border: 1px solid #43525f;
        border-radius: 6px;
      }
      #status {
        color: #aab8c4;
      }
      main {
        display: grid;
        place-items: center;
        height: calc(100vh - 52px);
        padding: 0 16px 16px;
      }
      canvas {
        display: block;
        width: min(100%, 720px);
        height: min(100%, 720px);
        aspect-ratio: 1;
        background: #080b0e;
        border-radius: 10px;
      }
      pre {
        position: fixed;
        right: 20px;
        bottom: 20px;
        max-width: 420px;
        max-height: 210px;
        overflow: auto;
        padding: 10px;
        background: #10151add;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <header>
      <button id="start">Start 3 × 30 s</button>
      <button id="stop">Stop renderer</button>
      <span id="status"
        >Waiting to start. Synthetic analyser; no audio/API traffic.</span
      >
    </header>
    <main><canvas id="visualizer"></canvas></main>
    <pre id="results">No measurements yet.</pre>
    <script type="module" src="./visualizer.js"></script>
  </body>
</html>
