[package]
name = "crate-desktop"
version = "0.1.0"
description = "Crate desktop app"
authors = ["Crate"]
edition = "2021"

[lib]
name = "crate_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sentry = { version = "0.44.0", default-features = false, features = ["backtrace", "contexts", "panic", "release-health", "ureq"] }
tauri = { version = "2", features = ["protocol-asset", "image-png", "tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-http = { version = "2", default-features = false, features = [
    "charset",
    "http2",
    "macos-system-configuration",
    "rustls-tls",
    "stream",
] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2"
tauri-plugin-fs = "2.5.1"
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.15.0"
webkit2gtk = { version = "2.0", features = ["v2_40"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSMenu", "NSMenuItem", "NSResponder"] }
objc2-foundation = { version = "0.3.2", features = ["NSData", "NSString"] }
libc = "0.2"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Keep the WinRT types aligned with Tauri/Wry so HWND and SMTC interop types
# come from the same generated bindings.
windows = { version = "0.62", features = [
    "Media",
    "Foundation",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_WinRT",
] }

[dev-dependencies]
sentry = { version = "0.44.0", default-features = false, features = ["test"] }

[profile.release]
debug = "line-tables-only"

[patch.crates-io]
tauri-plugin-http = { path = "vendor/tauri-plugin-http" }
# Keep the Linux binary loadable on the supported WebKitGTK 2.40 floor.
wry = { path = "vendor/wry" }
