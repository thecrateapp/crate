server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /_astro/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location /fonts/  { expires 1y; add_header Cache-Control "public, immutable"; }

    # Screenshots, clips and posters live on the host, outside the image and git.
    location /media/ {
        alias /usr/share/nginx/media/;
        expires 30d;
        add_header Cache-Control "public";
        types {
            video/webm webm;
            video/mp4 mp4;
            image/jpeg jpg jpeg;
            image/webp webp;
        }
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location / { try_files $uri $uri.html $uri/ =404; }
}
