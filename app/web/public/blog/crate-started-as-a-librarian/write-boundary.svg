<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 560"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">
    The Apply endpoint moves its file writes into the worker
  </title>
  <desc id="desc">
    On 19 March the API called apply_match and attempted audio.save against a
    read-only music mount. On 20 March the API created a task and returned its
    ID. The database held the task; the worker claimed it, saved tags through a
    writable mount and recorded results. Individual file saves could still fail.
  </desc>
  <defs>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto"
    >
      <path
        d="M0 0L10 5L0 10"
        fill="none"
        stroke="#67e8f9"
        stroke-width="1.5"
      />
    </marker>
  </defs>
  <style>
    text {
      font-family: "JetBrains Mono", monospace;
      fill: #d6dae3;
      font-size: 18px;
    }
    .label {
      fill: #67e8f9;
      letter-spacing: 1.5px;
      font-size: 17px;
    }
    .note {
      fill: #a1a7b5;
      font-size: 17px;
    }
    .box {
      fill: #0d0e14;
      stroke: #353947;
      stroke-width: 1;
    }
    .flow {
      fill: none;
      stroke: #67e8f9;
      stroke-width: 1.5;
      marker-end: url(#arrow);
    }
    .warn {
      fill: #fbbf24;
      font-size: 17px;
    }
  </style>
  <rect width="1200" height="560" rx="6" fill="#0a0a0f" />
  <text x="40" y="46" class="label">MAKING THE WRITE BOUNDARY REAL</text>
  <text x="40" y="103" class="label">
    19 MARCH / MUTATION INSIDE THE REQUEST
  </text>
  <rect x="40" y="127" width="425" height="120" rx="4" class="box" />
  <text x="60" y="164">API: apply_match()</text>
  <text x="60" y="200" class="note">calls Mutagen audio.save()</text>
  <rect x="735" y="127" width="425" height="120" rx="4" class="box" />
  <text x="755" y="164">/music:ro</text>
  <text x="755" y="200" class="note">API filesystem mount</text>
  <path d="M465 183H725" class="flow" />
  <text x="497" y="220" class="warn">write cannot succeed</text>
  <text x="40" y="317" class="label">20 MARCH / API RETURNS A TASK ID</text>
  <rect x="40" y="342" width="240" height="120" rx="4" class="box" />
  <text x="60" y="378">API</text>
  <text x="60" y="414" class="note">create_task()</text>
  <rect x="335" y="342" width="240" height="120" rx="4" class="box" />
  <text x="355" y="378">DATABASE</text>
  <text x="355" y="414" class="note">pending task</text>
  <rect x="630" y="342" width="240" height="120" rx="4" class="box" />
  <text x="650" y="378">WORKER</text>
  <text x="650" y="414" class="note">claim + apply</text>
  <rect x="925" y="342" width="235" height="120" rx="4" class="box" />
  <text x="945" y="378">/music</text>
  <text x="945" y="414" class="note">writable mount</text>
  <path d="M280 399H327" class="flow" />
  <path d="M575 399H622" class="flow" stroke-dasharray="9 4" />
  <path d="M870 399H917" class="flow" />
  <text x="40" y="511" class="note">
    The worker reports results. Files are still saved one at a time.
  </text>
  <text x="40" y="539" class="note">
    A completed request, an accepted task and a saved album are different
    states.
  </text>
</svg>
