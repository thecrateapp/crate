<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc"><title id="title">An exact change survives the queue</title><desc id="desc">The agent requests preparation and reads a complete immutable plan. Human approval binds its content when required. Application reserves one job. The worker checks current authority and sources, records effects, and distinguishes verification from execution. Uncertain started effects require reconciliation.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#67e8f9"/></marker></defs><rect width="1200" height="750" fill="#0a0a0f"/><g font-family="Inter,Arial,sans-serif" fill="#f0f1f5"><text x="48" y="53" font-size="17" font-family="JetBrains Mono,monospace" fill="#67e8f9">REMOTE AGENT / EXACT PLAN LIFECYCLE</text><text x="48" y="95" font-size="28">Permission at acceptance must still hold at execution</text>
<g fill="#0d0e14" stroke="#353947" stroke-width="2"><rect x="48" y="152" width="300" height="143" rx="12"/><rect x="450" y="152" width="300" height="143" rx="12"/><rect x="852" y="152" width="300" height="143" rx="12"/><rect x="48" y="428" width="300" height="150" rx="12"/><rect x="450" y="428" width="300" height="150" rx="12"/><rect x="852" y="428" width="300" height="150" rx="12"/></g>
<text x="72" y="190" font-size="21">Prepare selected work</text><text x="72" y="228" font-size="18" fill="#a1a7b5">Closed inputs + explicit targets</text><text x="72" y="262" font-size="18" fill="#a1a7b5">Worker produces full plan</text><text x="474" y="190" font-size="21">Review exact content</text><text x="474" y="228" font-size="18" fill="#a1a7b5">Hash + version + policy</text><text x="474" y="262" font-size="18" fill="#a1a7b5">Human decision when required</text><text x="876" y="190" font-size="21">Accept application</text><text x="876" y="228" font-size="18" fill="#a1a7b5">Reserve approval for one job</text><text x="876" y="262" font-size="18" fill="#a1a7b5">Replay returns that job</text>
<g fill="none" stroke="#67e8f9" stroke-width="2" marker-end="url(#a)"><path d="M348 222H450"/><path d="M750 222H852"/><path d="M1002 295V357H198V428" stroke-dasharray="9 4"/><path d="M348 501H450"/><path d="M750 501H852"/></g>
<rect x="411" y="337" width="380" height="38" rx="8" fill="#0a0a0f"/><text x="431" y="362" font-size="18" fill="#a1a7b5">Queue delay can change authority</text>
<text x="72" y="469" font-size="21">Recheck before effects</text><text x="72" y="508" font-size="18" fill="#a1a7b5">Live grants + enable flags</text><text x="72" y="543" font-size="18" fill="#a1a7b5">Approval + source identity</text><text x="474" y="469" font-size="21">Record effect boundary</text><text x="474" y="508" font-size="18" fill="#a1a7b5">Durable started marker</text><text x="474" y="543" font-size="18" fill="#a1a7b5">No blind repeat after a crash</text><text x="876" y="469" font-size="21">Inspect the outcome</text><text x="876" y="508" font-size="18" fill="#a1a7b5">Applied ≠ verified</text><text x="876" y="543" font-size="18" fill="#a1a7b5">Uncertain → reconciliation</text>
<path d="M48 632H1152" stroke="#353947"/><text x="48" y="676" font-size="19" fill="#a1a7b5">A new policy, revoked grant or changed source can invalidate an earlier decision.</text><text x="48" y="709" font-size="17" fill="#a1a7b5">The agent can request and inspect a change; it cannot manufacture human approval.</text></g></svg>