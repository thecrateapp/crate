<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Provider listings share one canonical show</title><desc id="desc">Ticketmaster and Last.fm aliases resolve to a canonical Crate show with a revision and per-field provenance. Attendance and reminders belong to that ID. Explicit consolidation transfers relationships from a duplicate and preserves its old ID as a redirect.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#67e8f9"/></marker></defs><rect width="1200" height="650" fill="#0a0a0f"/>
<text x="48" y="42" fill="#a1a1aa" font-family="'JetBrains Mono',monospace" font-size="14">CRATE ENGINEERING / CANONICAL SHOWS</text><text x="48" y="86" fill="#fafafa" font-family="sans-serif" font-size="28">Several listings. One concert people can act on.</text>
<g fill="#0d0e14" stroke="#33343e"><rect x="48" y="140" width="257" height="100" rx="5"/><rect x="48" y="275" width="257" height="100" rx="5"/><rect x="418" y="140" width="358" height="235" rx="5"/><rect x="889" y="140" width="263" height="100" rx="5"/><rect x="889" y="275" width="263" height="100" rx="5"/><rect x="418" y="469" width="358" height="124" rx="5"/></g>
<g font-family="'JetBrains Mono',monospace" font-size="14" fill="#67e8f9"><text x="70" y="173">PROVIDER ALIAS</text><text x="70" y="308">PROVIDER ALIAS</text><text x="440" y="173">CANONICAL SHOW ID</text><text x="440" y="503">OLD DUPLICATE ID</text></g>
<g font-family="sans-serif" font-size="20" fill="#fafafa"><text x="70" y="211">Ticketmaster + event ID</text><text x="70" y="346">Last.fm + event ID</text><text x="440" y="212">Date · venue · lineup</text><text x="911" y="183">Attendance</text><text x="911" y="318">Reminders</text></g>
<g font-family="sans-serif" font-size="16" fill="#b5b5c1"><text x="440" y="251">Revision checked at apply</text><text x="440" y="283">Per-field editor + evidence</text><text x="440" y="337">Ambiguous match → review</text><text x="911" y="214">Users keep their association</text><text x="911" y="349">Type + trigger state survive</text><text x="440" y="539">Archived, not erased</text><text x="440" y="569">merged_into_id → canonical</text></g>
<g stroke="#67e8f9" stroke-width="1.5" fill="none" marker-end="url(#a)"><path d="M305 190H405"/><path d="M305 325H405"/><path d="M776 190H876"/><path d="M776 325H876"/><path d="M597 469V388"/></g>
<g font-family="sans-serif" font-size="16" fill="#b5b5c1"><text x="48" y="491">Explicit consolidation</text><text x="48" y="521">moves relations and aliases.</text><text x="48" y="551">A shared lock prevents writes</text><text x="48" y="581">landing on the old target.</text><text x="889" y="491">A manual correction</text><text x="889" y="521">can survive provider sync.</text><text x="889" y="551">Evidence stays private</text><text x="889" y="581">to review workflows.</text></g>
<text x="48" y="627" fill="#80808e" font-family="'JetBrains Mono',monospace" font-size="13">SOLID ARROWS: IDENTITY REFERENCES · AUTOMATIC MATCHING DOES NOT RESOLVE EVERY DISAGREEMENT</text>
</svg>
