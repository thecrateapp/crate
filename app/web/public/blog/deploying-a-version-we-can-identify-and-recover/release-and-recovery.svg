<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">Release identity and state-aware recovery</title><desc id="desc">A release manifest pins each image by digest and retains its source revision. Preflight and a previous-release backup precede startup. After up returns successfully, automatic image rollback is disabled before health verification. An explicit recovery set includes PostgreSQL, durable Redis and configuration; image-only restoration does not restore those data.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#67e8f9"/></marker></defs><rect width="1200" height="780" fill="#0a0a0f"/>
<text x="48" y="42" fill="#a1a1aa" font-family="'JetBrains Mono',monospace" font-size="14">CRATE ENGINEERING / RELEASES AND RECOVERY</text><text x="48" y="85" fill="#fafafa" font-family="sans-serif" font-size="28">A known release is only half of a recovery plan.</text>
<g fill="#0d0e14" stroke="#33343e"><rect x="48" y="135" width="1104" height="144" rx="5"/><rect x="48" y="338" width="246" height="137" rx="5"/><rect x="358" y="338" width="246" height="137" rx="5"/><rect x="668" y="338" width="214" height="137" rx="5"/><rect x="946" y="338" width="206" height="137" rx="5"/><rect x="48" y="555" width="520" height="165" rx="5"/><rect x="632" y="555" width="520" height="165" rx="5"/></g>
<g font-family="'JetBrains Mono',monospace" font-size="14" fill="#67e8f9"><text x="70" y="170">COMPLETE RELEASE MANIFEST / FULL COMMIT SHA</text><text x="70" y="589">IMAGE-ONLY RECOVERY</text><text x="654" y="589">EXPLICIT STATE RECOVERY SET</text></g>
<g font-family="sans-serif" font-size="18" fill="#fafafa"><text x="70" y="211">Listen</text><text x="423" y="211">API</text><text x="772" y="211">Other required images</text><text x="70" y="375">Preflight</text><text x="380" y="375">Previous-release backup</text><text x="690" y="375">Start selected services</text><text x="968" y="375">Verify health</text></g>
<g font-family="sans-serif" font-size="16" fill="#b5b5c1"><text x="70" y="245">new digest · current source SHA</text><text x="423" y="245">reused digest · earlier source SHA</text><text x="772" y="245">every entry explicit and validated</text><text x="70" y="410">Images + config + secrets</text><text x="70" y="441">Required queue consumers</text><text x="380" y="410">Configuration + manifest</text><text x="380" y="441">Previous application images</text><text x="690" y="410">No server build</text><text x="690" y="441">Migrations may run</text><text x="968" y="410">API + readplane</text><text x="968" y="441">Configured public URLs</text><text x="70" y="628">Restores previous application images and configuration.</text><text x="70" y="660">Does not revert PostgreSQL or Redis.</text><text x="70" y="692">Requires knowing whether the old code can use the state.</text><text x="654" y="628">Quiesced PostgreSQL + durable Redis + configuration.</text><text x="654" y="660">Restore matching state before restarting the old release.</text><text x="654" y="692">Separate from the ordinary deployment backup.</text></g>
<g stroke="#67e8f9" stroke-width="1.5" fill="none" marker-end="url(#a)"><path d="M294 401H345"/><path d="M604 401H655"/><path d="M882 401H933"/></g>
<path d="M914 320V490" stroke="#fbbf24" stroke-width="1" stroke-dasharray="5 4"/>
<text x="485" y="518" fill="#fbbf24" font-family="'JetBrains Mono',monospace" font-size="14">AFTER up RETURNS: AUTOMATIC IMAGE ROLLBACK DISABLED</text>
<text x="48" y="755" fill="#80808e" font-family="'JetBrains Mono',monospace" font-size="13">SOLID ARROWS: DEPLOY ORDER · POST-START FAILURE REQUIRES DIAGNOSIS AND AN EXPLICIT RECOVERY DECISION</text>
</svg>
