<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc"><title id="title">One accepted model call, two queue lanes</title><desc id="desc">A request pins an action fingerprint. Separate interactive and bulk worker pools feed shared connection admission. Before reservation, capacity waits send no request. After reservation, one pinned provider call is validated and its known usage settles the budget; unknown usage retains the conservative charge.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#67e8f9"/></marker></defs><rect width="1200" height="790" fill="#0a0a0f"/><g font-family="Inter,Arial,sans-serif" fill="#f0f1f5"><text x="48" y="53" font-size="17" font-family="JetBrains Mono,monospace" fill="#67e8f9">AI RUNTIME / RESERVE BEFORE TRANSMISSION</text><text x="48" y="95" font-size="28">Queue capacity and provider capacity are separate limits</text>
<g fill="#0d0e14" stroke="#353947" stroke-width="2"><rect x="48" y="193" width="290" height="139" rx="12"/><rect x="425" y="146" width="300" height="100" rx="12"/><rect x="425" y="284" width="300" height="100" rx="12"/><rect x="830" y="193" width="322" height="139" rx="12"/><rect x="48" y="505" width="322" height="147" rx="12"/><rect x="453" y="505" width="322" height="147" rx="12"/><rect x="858" y="505" width="294" height="147" rx="12"/></g>
<text x="72" y="232" font-size="21">HTTP acceptance</text><text x="72" y="272" font-size="18" fill="#a1a7b5">Action + fingerprint + profile</text><text x="72" y="305" font-size="18" fill="#a1a7b5">Return task or base result</text>
<text x="449" y="183" font-size="21">ai</text><text x="449" y="219" font-size="18" fill="#a1a7b5">Individual proposals · 2 threads*</text><text x="449" y="321" font-size="21">ai_bulk</text><text x="449" y="357" font-size="18" fill="#a1a7b5">Long batches · 1 thread*</text><text x="854" y="232" font-size="21">Connection admission</text><text x="854" y="272" font-size="18" fill="#a1a7b5">Concurrency + daily allowance</text><text x="854" y="305" font-size="18" fill="#a1a7b5">One idempotent reservation</text>
<g fill="none" stroke="#67e8f9" stroke-width="2" marker-end="url(#a)"><path d="M338 244H375V196H425" stroke-dasharray="9 4"/><path d="M338 284H375V334H425" stroke-dasharray="9 4"/><path d="M725 196H775V244H830"/><path d="M725 334H775V284H830"/><path d="M991 332V441H209V505"/><path d="M370 578H453"/><path d="M775 578H858"/></g>
<rect x="401" y="420" width="392" height="40" fill="#0a0a0f"/><text x="423" y="446" font-size="18" fill="#67e8f9">Only admitted work can transmit</text>
<text x="72" y="545" font-size="21">One pinned provider call</text><text x="72" y="585" font-size="18" fill="#a1a7b5">Recheck context + authority</text><text x="72" y="621" font-size="18" fill="#a1a7b5">Deadline ends before task limit</text><text x="477" y="545" font-size="21">Validate the response</text><text x="477" y="585" font-size="18" fill="#a1a7b5">Typed domain result</text><text x="477" y="621" font-size="18" fill="#a1a7b5">No transport retry or fallback</text><text x="882" y="545" font-size="21">Settle usage once</text><text x="882" y="585" font-size="18" fill="#a1a7b5">Known: reported usage</text><text x="882" y="621" font-size="18" fill="#a1a7b5">Unknown: keep reservation</text>
<text x="48" y="714" font-size="18" fill="#a1a7b5">Capacity waiting before reservation has not sent data or paid for a provider call.</text><text x="48" y="749" font-size="17" fill="#a1a7b5">* Default worker sizes. Provider limits remain independent; bulk work yields to interactive demand.</text></g></svg>