<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">How a change reaches a Listen screen in Crate</title>
  <desc id="desc">A write and its domain event share a transaction. A relay publishes outbox rows to a Redis stream, the projector rebuilds the affected snapshot in PostgreSQL, and the Go read plane serves it, falling back to FastAPI when it is missing or expired.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#999ca0" stroke-width="1.2"/>
    </marker>
    <marker id="arrow-hi" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#67e8f9" stroke-width="1.2"/>
    </marker>
  </defs>
  <style>
    .bg { fill: #0a0a0f; }
    .node { fill: #0d0e14; stroke: rgba(241,245,249,0.22); stroke-width: 1; }
    .node-hi { fill: #0d0e14; stroke: #67e8f9; stroke-width: 1.4; }
    .title { font: 500 15px "JetBrains Mono", ui-monospace, Menlo, monospace; letter-spacing: 0.12em; fill: #f1f5f9; }
    .sub { font: 400 14px "JetBrains Mono", ui-monospace, Menlo, monospace; fill: #999ca0; }
    .lane { font: 400 13px "JetBrains Mono", ui-monospace, Menlo, monospace; letter-spacing: 0.16em; fill: #67e8f9; }
    .edge { fill: none; stroke: #999ca0; stroke-width: 1; }
    .edge-hi { fill: none; stroke: #67e8f9; stroke-width: 1.5; }
    .data { stroke-dasharray: 9 4; }
    .note { stroke-dasharray: 1 5; stroke-linecap: round; }
    .label { font: 400 13px "JetBrains Mono", ui-monospace, Menlo, monospace; fill: #999ca0; }
    .label-hi { font: 400 13px "JetBrains Mono", ui-monospace, Menlo, monospace; fill: #67e8f9; }
    .rule { stroke: rgba(241,245,249,0.08); stroke-width: 1; }
  </style>

  <rect class="bg" width="1200" height="640"/>

  <text class="lane" x="40" y="44">WRITE PATH · ASYNC</text>
  <line class="rule" x1="40" y1="56" x2="1160" y2="56"/>

  <rect class="node" x="40" y="86" width="190" height="76" rx="4"/>
  <text class="title" x="56" y="116">WRITE</text>
  <text class="sub" x="56" y="140">API or worker</text>

  <rect class="node" x="270" y="86" width="210" height="76" rx="4"/>
  <text class="title" x="286" y="116">OUTBOX</text>
  <text class="sub" x="286" y="140">same transaction</text>

  <rect class="node" x="520" y="86" width="190" height="76" rx="4"/>
  <text class="title" x="536" y="116">RELAY</text>
  <text class="sub" x="536" y="140">SKIP LOCKED</text>

  <rect class="node" x="750" y="86" width="190" height="76" rx="4"/>
  <text class="title" x="766" y="116">STREAM</text>
  <text class="sub" x="766" y="140">crate:domain_events</text>

  <rect class="node" x="980" y="86" width="180" height="76" rx="4"/>
  <text class="title" x="996" y="116">PROJECTOR</text>
  <text class="sub" x="996" y="140">every 5 s · 200</text>

  <path class="edge data" d="M230 124 H264" marker-end="url(#arrow)"/>
  <path class="edge data" d="M480 124 H514" marker-end="url(#arrow)"/>
  <path class="edge data" d="M710 124 H744" marker-end="url(#arrow)"/>
  <path class="edge data" d="M940 124 H974" marker-end="url(#arrow)"/>

  <text class="lane" x="40" y="250">READ PATH · PER REQUEST</text>
  <line class="rule" x1="40" y1="262" x2="1160" y2="262"/>

  <rect class="node-hi" x="960" y="300" width="200" height="76" rx="4"/>
  <text class="title" x="976" y="330">UI_SNAPSHOTS</text>
  <text class="sub" x="976" y="354">PostgreSQL rows</text>

  <path class="edge data" d="M1070 162 V294" marker-end="url(#arrow)"/>
  <text class="label" x="1060" y="236" text-anchor="end">upsert, version + 1</text>

  <rect class="node-hi" x="560" y="300" width="230" height="76" rx="4"/>
  <text class="title" x="576" y="330">READ PLANE · GO</text>
  <text class="sub" x="576" y="354">2 s LRU · 128 MB</text>

  <rect class="node-hi" x="40" y="300" width="200" height="76" rx="4"/>
  <text class="title" x="56" y="330">LISTEN</text>
  <text class="sub" x="56" y="354">web · iOS · Android</text>

  <path class="edge-hi" d="M954 338 H796" marker-end="url(#arrow-hi)"/>
  <text class="label-hi" x="808" y="326">one-row SELECT</text>

  <path class="edge-hi" d="M554 330 H246" marker-end="url(#arrow-hi)"/>
  <text class="label-hi" x="290" y="318">GET · X-Crate-Readplane: hit</text>

  <path class="edge note" d="M554 360 H246" marker-end="url(#arrow)"/>
  <text class="label" x="290" y="382">SSE · snapshot changed</text>

  <rect class="node" x="560" y="470" width="230" height="76" rx="4"/>
  <text class="title" x="576" y="500">FASTAPI</text>
  <text class="sub" x="576" y="524">fallback, builds fresh</text>

  <path class="edge" d="M675 376 V464" marker-end="url(#arrow)"/>
  <text class="label" x="688" y="414">missing · expired</text>
  <text class="label" x="688" y="432">?fresh=1</text>

  <line class="rule" x1="40" y1="586" x2="1160" y2="586"/>
  <path class="edge-hi" d="M40 612 H84"/>
  <text class="label" x="94" y="616">hot read</text>
  <path class="edge data" d="M200 612 H244"/>
  <text class="label" x="254" y="616">data, async</text>
  <path class="edge note" d="M380 612 H424"/>
  <text class="label" x="434" y="616">notification</text>
  <path class="edge" d="M570 612 H614"/>
  <text class="label" x="624" y="616">fallback request</text>
</svg>
