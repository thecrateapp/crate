<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Listening history stays local; statistics and scrobbles follow</title><desc id="desc">The event and dirty-day marker share a database transaction. After commit, separate asynchronous paths refresh projections and send eligible scrobbles. User-local dates and a per-user lock govern rebuilding. Dashboards read snapshots.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#67e8f9"/></marker></defs>
<rect width="1200" height="650" fill="#0a0a0f"/>
<text x="48" y="42" fill="#a1a1aa" font-family="'JetBrains Mono',monospace" font-size="14">CRATE ENGINEERING / LISTENING HISTORY</text>
<text x="48" y="85" fill="#fafafa" font-family="sans-serif" font-size="28">Store the listen once. Give each interpretation its own work.</text>
<g fill="#0d0e14" stroke="#33343e"><rect x="48" y="132" width="335" height="277" rx="5"/><rect x="484" y="132" width="324" height="277" rx="5"/><rect x="900" y="132" width="252" height="277" rx="5"/><rect x="484" y="465" width="668" height="126" rx="5"/></g>
<g font-family="'JetBrains Mono',monospace" fill="#67e8f9" font-size="14"><text x="70" y="168">ONE DATABASE TRANSACTION</text><text x="506" y="168">WORKER / PER-USER LOCK</text><text x="922" y="168">READ SIDE</text><text x="506" y="501">SEPARATE SCROBBLE DISPATCH</text></g>
<g font-family="sans-serif" font-size="20" fill="#fafafa"><text x="70" y="211">user_play_events</text><text x="70" y="300">dirty local day</text><text x="506" y="212">Rebuild affected days</text><text x="922" y="212">Dashboard snapshot</text></g>
<g font-family="sans-serif" font-size="16" fill="#b5b5c1"><text x="70" y="241">Client event ID + user</text><text x="70" y="265">Time played, outcome, context</text><text x="70" y="330">Date of ended_at in user timezone</text><text x="70" y="380">Commit both, or roll back both</text><text x="506" y="249">Daily + hourly listening</text><text x="506" y="278">Firsts + derived sessions</text><text x="506" y="307">Period statistics</text><text x="506" y="380">Full rebuild remains the reference</text><text x="922" y="249">Cheap to serve</text><text x="922" y="278">Can lag behind events</text><text x="922" y="337">Today counter:</text><text x="922" y="365">separate live view</text><text x="506" y="538">Eligible event → linked providers → recorded outcomes</text><text x="506" y="568">A provider failure leaves the local listening event intact.</text></g>
<g stroke="#67e8f9" fill="none" stroke-width="1.5" marker-end="url(#a)"><path d="M383 235H471" stroke-dasharray="9 4"/><path d="M808 235H887" stroke-dasharray="9 4"/><path d="M215 409V530H470" stroke-dasharray="9 4"/></g>
<text x="48" y="625" fill="#80808e" font-family="'JetBrains Mono',monospace" font-size="13">DASHED ARROWS: AFTER-COMMIT / BACKGROUND WORK · REBUILDING CANNOT RECREATE AN EVENT NEVER STORED</text>
</svg>
