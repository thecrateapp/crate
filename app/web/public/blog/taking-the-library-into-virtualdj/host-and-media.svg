<path d="M40 727 H1160" stroke="#353947"/><text x="40" y="767" fill="#f1f5f9">HOST CONSTRAINT</text><text x="250" y="767" font-size="15">The host can reuse a URL without calling GetStreamUrl again.</text><text x="40" y="808" fill="#f1f5f9">TICKET POLICY</text><text x="250" y="808" font-size="15">12 h for token-bound media; ordinary session tickets remain 60 s.</text><text x="40" y="849" fill="#f1f5f9">REVOCATION LIMIT</text><text x="250" y="849" font-size="15">New access can stop; bytes already downloaded stay with the host.</text></g></svg>