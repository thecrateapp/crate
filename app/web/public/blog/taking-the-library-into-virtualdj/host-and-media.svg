<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 895" role="img" aria-labelledby="title desc">
<title id="title">Crate supplies tracks; VirtualDJ owns the decks</title><desc id="desc">The native Online Source keeps its account token in the OS credential store, uses it for catalogue, compatibility and media-ticket requests, and hands the host an exact-path ticketed URL. VirtualDJ downloads the track itself and mixes through its own engine. Optional Crate Automix adds candidates to the host queue; it does not send crossfader or tempo commands. New media requests recheck access; already downloaded audio remains in the host.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#67e8f9"/></marker></defs>
<rect width="1200" height="895" fill="#0a0a0f"/><g font-family="'JetBrains Mono',monospace" font-size="17" fill="#aeb3c2">
<text x="40" y="48" fill="#67e8f9" font-size="18">THE PLUGIN DOES NOT BECOME THE AUDIO ENGINE</text><text x="40" y="80">Account access, media delivery and mixing have different owners.</text>
<g fill="#0d0e14" stroke="#353947"><rect x="40" y="135" width="340" height="210" rx="5"/><rect x="820" y="135" width="340" height="210" rx="5"/><rect x="40" y="475" width="340" height="205" rx="5"/><rect x="820" y="475" width="340" height="205" rx="5"/></g>
