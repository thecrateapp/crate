<text x="842" y="173" fill="#f1f5f9">CRATE API</text><text x="842" y="213">Catalogue + compatible tracks</text><text x="842" y="248">Scopes + contract negotiation</text><text x="842" y="283">Ready local media resolution</text><text x="842" y="318">Issue exact-path ticket</text>
