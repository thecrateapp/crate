<text x="230" y="394" font-size="15">Track list / media URL</text><text x="230" y="424" font-size="15">Optional Automix queue additions</text>
<text x="62" y="515" fill="#f1f5f9">VIRTUALDJ HOST</text><text x="62" y="554">Downloads and retains audio</text><text x="62" y="589">Decks · cue points · Automix</text><text x="62" y="624">User controls actual mixing</text><text x="62" y="659">Crate does not drive the fader</text>
<text x="842" y="515" fill="#f1f5f9">CRATE MEDIA ROUTE</text><text x="842" y="554">Check ticket path + identity</text><text x="842" y="589">Check current token access</text><text x="842" y="624">Serve authorized audio</text><text x="842" y="659">Deny new revoked requests</text>
