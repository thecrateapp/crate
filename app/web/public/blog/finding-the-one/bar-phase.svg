<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">One stray beat moves every bar after it</title>
  <desc id="desc">Schematic of the same fourteen beats in two rows; this is an illustration, not a measured track. In the top row the model reports one extra beat 90 ms after the sixth beat. Counting beats by their position modulo four, the bar starts after that point fall one beat before the model's downbeats, and the downbeats split their votes two against two between two bar positions, so the track gets no downbeat. In the bottom row, with the DBN post-processing, there is no extra beat, the counted bar starts and the model's downbeats coincide, and all four downbeats vote for the same position.</desc>
  <style>
    .bg { fill: #0a0a0f; }
    .lane { font: 400 20px "JetBrains Mono", ui-monospace, Menlo, monospace; letter-spacing: 0.08em; fill: #67e8f9; }
    .label { font: 400 20px "JetBrains Mono", ui-monospace, Menlo, monospace; letter-spacing: 0.02em; fill: #999ca0; }
    .count { font: 500 23px "JetBrains Mono", ui-monospace, Menlo, monospace; fill: #f1f5f9; }
    .count-hi { font: 500 23px "JetBrains Mono", ui-monospace, Menlo, monospace; fill: #67e8f9; }
    .result { font: 500 20px "JetBrains Mono", ui-monospace, Menlo, monospace; letter-spacing: 0.08em; fill: #f1f5f9; }
    .rule { stroke: rgba(241,245,249,0.08); stroke-width: 1; }
    .axis { stroke: rgba(241,245,249,0.34); stroke-width: 1; }
    .beat { stroke: rgba(241,245,249,0.6); stroke-width: 1.5; }
    .stray { stroke: #f1f5f9; stroke-width: 1.5; stroke-dasharray: 3 3; }
    .down { fill: #67e8f9; }
    .bar-ok { fill: #67e8f9; }
    .bar-off { fill: #0d0e14; stroke: #f1f5f9; stroke-width: 1.4; }
    .link { stroke: #999ca0; stroke-width: 1; stroke-dasharray: 1 5; stroke-linecap: round; fill: none; }
  </style>

  <rect class="bg" width="1200" height="600"/>

  <!-- Without DBN -->
  <text class="lane" x="40" y="40">WITHOUT DBN · RAW MODEL BEATS</text>
  <line class="rule" x1="40" y1="52" x2="1160" y2="52"/>

  <text class="label" x="40" y="96">DOWNBEATS</text>
  <path class="down" d="M240 84 l8 8 l-8 8 l-8 -8 z"/>
  <path class="down" d="M496 84 l8 8 l-8 8 l-8 -8 z"/>
  <path class="down" d="M752 84 l8 8 l-8 8 l-8 -8 z"/>
  <path class="down" d="M1008 84 l8 8 l-8 8 l-8 -8 z"/>

  <text class="label" x="40" y="146">BEATS</text>
  <line class="axis" x1="224" y1="142" x2="1100" y2="142"/>
  <line class="beat" x1="240" y1="124" x2="240" y2="160"/>
  <line class="beat" x1="304" y1="124" x2="304" y2="160"/>
  <line class="beat" x1="368" y1="124" x2="368" y2="160"/>
  <line class="beat" x1="432" y1="124" x2="432" y2="160"/>
  <line class="beat" x1="496" y1="124" x2="496" y2="160"/>
  <line class="beat" x1="560" y1="124" x2="560" y2="160"/>
  <line class="stray" x1="578" y1="124" x2="578" y2="160"/>
  <line class="beat" x1="624" y1="124" x2="624" y2="160"/>
  <line class="beat" x1="688" y1="124" x2="688" y2="160"/>
  <line class="beat" x1="752" y1="124" x2="752" y2="160"/>
  <line class="beat" x1="816" y1="124" x2="816" y2="160"/>
  <line class="beat" x1="880" y1="124" x2="880" y2="160"/>
  <line class="beat" x1="944" y1="124" x2="944" y2="160"/>
  <line class="beat" x1="1008" y1="124" x2="1008" y2="160"/>
  <line class="beat" x1="1072" y1="124" x2="1072" y2="160"/>
  <text class="label" x="592" y="116">+90 MS</text>

  <text class="label" x="40" y="194">BAR POSITION</text>
  <text class="count-hi" x="240" y="194" text-anchor="middle">1</text>
  <text class="count" x="304" y="194" text-anchor="middle">2</text>
  <text class="count" x="368" y="194" text-anchor="middle">3</text>
  <text class="count" x="432" y="194" text-anchor="middle">4</text>
  <text class="count-hi" x="496" y="194" text-anchor="middle">1</text>
  <text class="count" x="560" y="194" text-anchor="middle">2</text>
  <text class="count" x="580" y="214" text-anchor="middle">3</text>
  <text class="count" x="624" y="194" text-anchor="middle">4</text>
  <text class="count" x="688" y="194" text-anchor="middle">1</text>
  <text class="count" x="752" y="194" text-anchor="middle">2</text>
  <text class="count" x="816" y="194" text-anchor="middle">3</text>
  <text class="count" x="880" y="194" text-anchor="middle">4</text>
  <text class="count" x="944" y="194" text-anchor="middle">1</text>
  <text class="count" x="1008" y="194" text-anchor="middle">2</text>
  <text class="count" x="1072" y="194" text-anchor="middle">3</text>

  <text class="label" x="40" y="250">BAR STARTS</text>
  <rect class="bar-ok" x="233" y="238" width="14" height="14" rx="2"/>
  <rect class="bar-ok" x="489" y="238" width="14" height="14" rx="2"/>
  <rect class="bar-off" x="681" y="238" width="14" height="14" rx="2"/>
  <rect class="bar-off" x="937" y="238" width="14" height="14" rx="2"/>
  <path class="link" d="M695 245 H745"/>
  <path class="link" d="M951 245 H1001"/>
  <text class="label" x="688" y="280">ONE BEAT EARLY FROM HERE ON</text>

  <text class="result" x="40" y="318">DOWNBEAT VOTES 2 : 2 · BELOW 60% · NO DOWNBEAT, NO PHRASES</text>

  <!-- With DBN -->
  <text class="lane" x="40" y="370">WITH DBN · CONSISTENT BEAT SEQUENCE</text>
  <line class="rule" x1="40" y1="382" x2="1160" y2="382"/>

  <text class="label" x="40" y="426">DOWNBEATS</text>
  <path class="down" d="M240 414 l8 8 l-8 8 l-8 -8 z"/>
  <path class="down" d="M496 414 l8 8 l-8 8 l-8 -8 z"/>
  <path class="down" d="M752 414 l8 8 l-8 8 l-8 -8 z"/>
  <path class="down" d="M1008 414 l8 8 l-8 8 l-8 -8 z"/>

  <text class="label" x="40" y="476">BEATS</text>
  <line class="axis" x1="224" y1="472" x2="1100" y2="472"/>
  <line class="beat" x1="240" y1="454" x2="240" y2="490"/>
  <line class="beat" x1="304" y1="454" x2="304" y2="490"/>
  <line class="beat" x1="368" y1="454" x2="368" y2="490"/>
  <line class="beat" x1="432" y1="454" x2="432" y2="490"/>
  <line class="beat" x1="496" y1="454" x2="496" y2="490"/>
  <line class="beat" x1="560" y1="454" x2="560" y2="490"/>
  <line class="beat" x1="624" y1="454" x2="624" y2="490"/>
  <line class="beat" x1="688" y1="454" x2="688" y2="490"/>
  <line class="beat" x1="752" y1="454" x2="752" y2="490"/>
  <line class="beat" x1="816" y1="454" x2="816" y2="490"/>
  <line class="beat" x1="880" y1="454" x2="880" y2="490"/>
  <line class="beat" x1="944" y1="454" x2="944" y2="490"/>
  <line class="beat" x1="1008" y1="454" x2="1008" y2="490"/>
  <line class="beat" x1="1072" y1="454" x2="1072" y2="490"/>

  <text class="label" x="40" y="524">BAR POSITION</text>
  <text class="count-hi" x="240" y="524" text-anchor="middle">1</text>
  <text class="count" x="304" y="524" text-anchor="middle">2</text>
  <text class="count" x="368" y="524" text-anchor="middle">3</text>
  <text class="count" x="432" y="524" text-anchor="middle">4</text>
  <text class="count-hi" x="496" y="524" text-anchor="middle">1</text>
  <text class="count" x="560" y="524" text-anchor="middle">2</text>
  <text class="count" x="624" y="524" text-anchor="middle">3</text>
  <text class="count" x="688" y="524" text-anchor="middle">4</text>
  <text class="count-hi" x="752" y="524" text-anchor="middle">1</text>
  <text class="count" x="816" y="524" text-anchor="middle">2</text>
  <text class="count" x="880" y="524" text-anchor="middle">3</text>
  <text class="count" x="944" y="524" text-anchor="middle">4</text>
  <text class="count-hi" x="1008" y="524" text-anchor="middle">1</text>
  <text class="count" x="1072" y="524" text-anchor="middle">2</text>

  <text class="result" x="40" y="572">DOWNBEAT VOTES 4 : 0 · ANCHORED TO MODEL DOWNBEATS</text>
</svg>
