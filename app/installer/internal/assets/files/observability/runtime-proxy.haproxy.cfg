global
  maxconn 32
  nbthread 1
defaults
  mode http
  timeout connect 3s
  timeout client 60s
  timeout server 60s
frontend docker_read
  bind :2375
  http-request deny unless { method GET } { path -m reg ^/(v1\.[0-9]{1,3}/)?(_ping|version|info|events|containers/json|containers/[a-f0-9]{64}/json|images/sha256:[a-f0-9]{64}/json)$ }
  default_backend docker
backend docker
  server docker /var/run/docker.sock
frontend containerd_metadata
  bind /run/crate-runtime-proxy/containerd.sock mode 600 proto h2
  bind :2376 proto h2
  # Docker-backed cAdvisor needs only metadata for one container in moby.
  http-request deny unless { method POST } { path -m str /containerd.services.containers.v1.Containers/Get } { req.hdr_cnt(containerd-namespace) eq 1 } { req.hdr(containerd-namespace) -m str moby }
  default_backend containerd
backend containerd
  server containerd /var/run/crate-containerd.sock proto h2
