map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream crate_readplane_backend {
    server crate-readplane:8686 max_fails=2 fail_timeout=5s;
    server crate-api:8585 backup;
    keepalive 32;
}

map $request_method $read_backend {
    default http://crate-api:8585;
    GET http://crate_readplane_backend;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    set $api_backend http://crate-api:8585;

    # Docker DNS resolver for dynamic upstream resolution
    resolver 127.0.0.11 valid=10s;
    error_page 418 = @api_mutation;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;

    # Static assets with cache
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Allow album uploads through the Listen-origin API proxy.
    client_max_body_size 512m;

    # Apple Universal Links association for iOS native OAuth callbacks.
    location = /.well-known/apple-app-site-association {
        set $backend http://crate-api:8585;
        proxy_pass $backend/api/auth/apple-app-site-association;
        proxy_set_header Host $host;
        default_type application/json;
    }

    location = /apple-app-site-association {
        set $backend http://crate-api:8585;
        proxy_pass $backend/api/auth/apple-app-site-association;
        proxy_set_header Host $host;
        default_type application/json;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript image/svg+xml;

    # Snapshot/cache SSE routes keep long-lived connections without applying
    # streaming settings to every API request.
    location = /api/cache/events {
        if ($request_method != GET) { return 418; }
        proxy_pass $read_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 24h;
    }

    location = /api/me/home/discovery-stream {
        proxy_pass $read_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 24h;
    }

    # Playback and range-capable track reads use the Go proxy. It can fall
    # back to FastAPI while preserving Range and federation stream semantics.
    location ^~ /api/federation/remote/streams/ {
        proxy_pass $read_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5m;
    }

    location ^~ /api/tracks/ {
        proxy_pass $read_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5m;
    }

    location = /api/me/stats/dashboard {
        proxy_pass $read_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        proxy_connect_timeout 1s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    # Hot GET surfaces are readplane-first. Unimplemented shapes are handled
    # by its bounded FastAPI fallback.
    location ~ ^/api/(?:auth/me$|me$|me/(?:home|albums|follows)(?:/|$)|me/(?:history|likes)$|search$|favorites$|genres(?:/|$)|artists/|artist-slugs/|albums/) {
        proxy_pass $read_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        proxy_connect_timeout 1s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    location ^~ /api/catalog/ {
        proxy_pass $read_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        proxy_connect_timeout 1s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    # Non-GET requests that share a read-optimized path retain mutation budgets.
    location @api_mutation {
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Mutations, uploads and compatibility routes remain on FastAPI.
    location /api/ {
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 2s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Public social previews need server-rendered HTML with OG tags.
    location /share/ {
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
