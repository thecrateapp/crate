apply plugin: 'com.android.application'
apply plugin: 'io.sentry.android.gradle'

def releaseTaskRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains("release")
}
def sentryAuthToken = System.getenv("SENTRY_AUTH_TOKEN")
def sentryUploadEnabled = (
    releaseTaskRequested
        && sentryAuthToken != null
        && !sentryAuthToken.trim().isEmpty()
)
def releaseKeystorePath = System.getenv("CRATE_ANDROID_KEYSTORE_FILE")
def releaseStorePassword = System.getenv("CRATE_ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("CRATE_ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("CRATE_ANDROID_KEY_PASSWORD")
def releaseVersionName = System.getenv("CRATE_ANDROID_VERSION_NAME")
def releaseVersionCode = System.getenv("CRATE_ANDROID_VERSION_CODE")
def configuredCastReceiverAppId = (
    System.getenv("CRATE_CAST_RECEIVER_APP_ID")
        ?: System.getenv("VITE_CAST_RECEIVER_APP_ID")
)
def castReceiverAppId = (configuredCastReceiverAppId ?: "CC1AD845").trim()
if (!(castReceiverAppId ==~ /[A-Za-z0-9]{8}/)) {
    throw new GradleException(
        "Cast receiver application ID must contain exactly 8 alphanumeric characters"
    )
}
def requiredReleaseValues = [
    "CRATE_ANDROID_KEYSTORE_FILE": releaseKeystorePath,
    "CRATE_ANDROID_KEYSTORE_PASSWORD": releaseStorePassword,
    "CRATE_ANDROID_KEY_ALIAS": releaseKeyAlias,
    "CRATE_ANDROID_KEY_PASSWORD": releaseKeyPassword,
    "CRATE_ANDROID_VERSION_NAME": releaseVersionName,
    "CRATE_ANDROID_VERSION_CODE": releaseVersionCode,
    "CRATE_CAST_RECEIVER_APP_ID": configuredCastReceiverAppId,
]
if (releaseTaskRequested) {
    def missing = requiredReleaseValues.findAll { !it.value }.keySet()
    if (!missing.isEmpty()) {
        throw new GradleException(
            "Release build requires environment variables: ${missing.join(', ')}"
        )
    }
    if (!file(releaseKeystorePath).exists()) {
        throw new GradleException(
            "Release keystore does not exist: ${releaseKeystorePath}"
        )
    }
}

sentry {
    includeProguardMapping = true
    autoUploadProguardMapping = sentryUploadEnabled
    uploadNativeSymbols = false
    authToken = sentryAuthToken
    org = "ninja-development"
    projectName = "crate-listen"
    telemetry = false

    autoInstallation {
        enabled = false
    }
    tracingInstrumentation {
        enabled = false
    }
}

android {
    namespace = "app.cratemusic.crate"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.cratemusic.crate"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode releaseVersionCode ? Integer.parseInt(releaseVersionCode) : 1
        versionName releaseVersionName ?: "0.0.0-dev"
        resValue "string", "crate_cast_receiver_app_id", castReceiverAppId
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseKeystorePath) {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.media:media:$androidxMediaVersion"
    implementation "androidx.media3:media3-common:$androidxMedia3Version"
    implementation "androidx.media3:media3-datasource:$androidxMedia3Version"
    implementation "androidx.media3:media3-exoplayer:$androidxMedia3Version"
    implementation "androidx.media3:media3-session:$androidxMedia3Version"
    implementation "com.google.android.gms:play-services-cast-framework:$googleCastFrameworkVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
